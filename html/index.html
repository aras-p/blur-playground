<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Playground</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .dropzone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 20px 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: #888;
            background-color: #252525;
        }
        .dropzone input {
            display: none;
        }
        #canvas {
            border: 1px solid #333;
            max-width: 100%;
            background: #000;
        }
        #status {
            margin-top: 10px;
            color: #888;
        }
        #error {
            color: #ff6b6b;
            margin-top: 10px;
        }
        .control-group {
            background: #252525;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-group label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-transform: none;
            color: #e0e0e0;
            font-size: 14px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-row label {
            min-width: 60px;
            text-transform: none;
            color: #e0e0e0;
            font-size: 14px;
        }
        .slider-row input[type="range"] {
            flex: 1;
            min-width: 150px;
        }
        .slider-row .value {
            min-width: 40px;
            text-align: right;
            font-family: monospace;
        }
        .slider-row.disabled label,
        .slider-row.disabled .value {
            color: #555;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-row label {
            text-transform: none;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept="image/png,image/jpeg">
            <span>Click to browse or drag & drop PNG/JPG</span>
        </div>

        <div class="control-group">
            <label>Blur Mode</label>
            <div class="radio-group">
                <label><input type="radio" name="blurMode" value="box" checked> Box</label>
                <label><input type="radio" name="blurMode" value="tent"> Tent</label>
                <label><input type="radio" name="blurMode" value="gaussian"> Gaussian</label>
                <label><input type="radio" name="blurMode" value="dual_kawase"> Dual Kawase</label>
                <label><input type="radio" name="blurMode" value="split_kawase"> Split Kawase</label>
            </div>
        </div>

        <div class="control-group">
            <label>Blur Radius</label>
            <div class="slider-row">
                <label for="radiusX">X:</label>
                <input type="range" id="radiusX" min="0" max="500" value="10">
                <span class="value" id="radiusXValue">10</span>
            </div>
            <div class="slider-row disabled" id="radiusYRow">
                <label for="radiusY">Y:</label>
                <input type="range" id="radiusY" min="0" max="500" value="10" disabled>
                <span class="value" id="radiusYValue">10</span>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="lockRadius" checked>
                <label for="lockRadius">Lock X & Y</label>
            </div>
        </div>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="status">WebGPU initializing...</div>
    <div id="error"></div>

<script>
// ============================================================================
// WGSL Shaders
// ============================================================================

const PASSTHROUGH_SHADER = `
struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f,
}

@vertex
fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
    // Full-screen triangle
    var pos = array<vec2f, 3>(
        vec2f(-1.0, -1.0),
        vec2f( 3.0, -1.0),
        vec2f(-1.0,  3.0)
    );
    var uv = array<vec2f, 3>(
        vec2f(0.0, 1.0),
        vec2f(2.0, 1.0),
        vec2f(0.0, -1.0)
    );

    var output: VertexOutput;
    output.position = vec4f(pos[vertexIndex], 0.0, 1.0);
    output.uv = uv[vertexIndex];
    return output;
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;

// Linear to sRGB conversion
fn linearToSrgb(linear: vec3f) -> vec3f {
    let cutoff = linear < vec3f(0.0031308);
    let higher = vec3f(1.055) * pow(linear, vec3f(1.0/2.4)) - vec3f(0.055);
    let lower = linear * vec3f(12.92);
    return select(higher, lower, cutoff);
}

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let color = textureSample(tex, texSampler, in.uv);
    // Convert from linear back to sRGB for display
    return vec4f(linearToSrgb(color.rgb), color.a);
}
`;

const SEPARABLE_BLUR_SHADER = `
struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f,
}

@vertex
fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
    // Full-screen triangle
    var pos = array<vec2f, 3>(
        vec2f(-1.0, -1.0),
        vec2f( 3.0, -1.0),
        vec2f(-1.0,  3.0)
    );
    var uv = array<vec2f, 3>(
        vec2f(0.0, 1.0),
        vec2f(2.0, 1.0),
        vec2f(0.0, -1.0)
    );

    var output: VertexOutput;
    output.position = vec4f(pos[vertexIndex], 0.0, 1.0);
    output.uv = uv[vertexIndex];
    return output;
}

struct BlurParams {
    uvStep: vec2f,
    kernelWidth: i32,
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var texKernel: texture_1d<f32>;
@group(0) @binding(3) var<uniform> params: BlurParams;

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    // Center sample with center weight
    var col = textureSample(tex, texSampler, in.uv) * textureLoad(texKernel, 0, 0).r;

    // Sample in both directions with symmetric weights
    for (var i: i32 = 1; i < params.kernelWidth; i++) {
        let w = textureLoad(texKernel, i, 0).r;
        col += textureSample(tex, texSampler, in.uv - params.uvStep * f32(i)) * w;
        col += textureSample(tex, texSampler, in.uv + params.uvStep * f32(i)) * w;
    }

    return col;
}
`;

// Shared vertex shader for Dual Kawase (used by all DK shaders)
const DK_VERTEX_SHADER = `
struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f,
}

@vertex
fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
    var pos = array<vec2f, 3>(
        vec2f(-1.0, -1.0),
        vec2f( 3.0, -1.0),
        vec2f(-1.0,  3.0)
    );
    var uv = array<vec2f, 3>(
        vec2f(0.0, 1.0),
        vec2f(2.0, 1.0),
        vec2f(0.0, -1.0)
    );

    var output: VertexOutput;
    output.position = vec4f(pos[vertexIndex], 0.0, 1.0);
    output.uv = uv[vertexIndex];
    return output;
}
`;

const DK_DOWNSAMPLE_SHADER = DK_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, texSampler, in.uv) * 4.0;
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f(-0.5, -0.5));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f(-0.5,  0.5));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 0.5, -0.5));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 0.5,  0.5));
    return col / 8.0;
}
`;

const DK_UPSAMPLE_SHADER = DK_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 0.0, -1.0));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 0.0,  1.0));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f(-1.0,  0.0));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 1.0,  0.0));
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f(-0.5, -0.5)) * 2.0;
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f(-0.5,  0.5)) * 2.0;
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 0.5, -0.5)) * 2.0;
    col += textureSample(tex, texSampler, in.uv + params.uvStep * vec2f( 0.5,  0.5)) * 2.0;
    return col / 12.0;
}
`;

const DK_MIX_SHADER = DK_VERTEX_SHADER + `
struct Params {
    ratio: f32,
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let col = textureSample(tex, texSampler, in.uv);
    return vec4f(col.rgb, params.ratio);
}
`;

const DK_COPY_SHADER = DK_VERTEX_SHADER + `
@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    return textureSample(tex, texSampler, in.uv);
}
`;

const SPLIT_KAWASE_STEP_SHADER = DK_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
    w00: f32,
    w05: f32,
    w10: f32,
    w15: f32,
    w20: f32,
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    let st = params.uvStep;
    col += textureSample(tex, texSampler, in.uv) * params.w00;
    col += textureSample(tex, texSampler, in.uv + st * (-0.5)) * params.w05;
    col += textureSample(tex, texSampler, in.uv + st * ( 0.5)) * params.w05;
    col += textureSample(tex, texSampler, in.uv + st * (-1.0)) * params.w10;
    col += textureSample(tex, texSampler, in.uv + st * ( 1.0)) * params.w10;
    col += textureSample(tex, texSampler, in.uv + st * (-1.5)) * params.w15;
    col += textureSample(tex, texSampler, in.uv + st * ( 1.5)) * params.w15;
    col += textureSample(tex, texSampler, in.uv + st * (-2.0)) * params.w20;
    col += textureSample(tex, texSampler, in.uv + st * ( 2.0)) * params.w20;
    // Normalize by sum of weights
    let weightSum = params.w00 + (params.w05 + params.w10 + params.w15 + params.w20) * 2.0;
    return col / weightSum;
}
`;

// ============================================================================
// WebGPU State
// ============================================================================

let device = null;
let context = null;
let canvasFormat = null;
let passthroughPipeline = null;
let separablePipeline = null;
let dkDownPipeline = null;
let dkUpPipeline = null;
let dkMixPipeline = null;
let dkCopyPipeline = null;
let splitKawasePipeline = null;
let sampler = null;
let samplerNearest = null;
let imageTexture = null;
let blurTempTexture = null;
let blurOutputTexture = null;
let bindGroup = null;
let currentImageSize = { width: 0, height: 0 };

// Reusable resources for Kawase blurs
let kawaseUniformBuffers = [];  // Pool of uniform buffers
let kawaseUniformBufferIndex = 0;
let kawaseTextureCache = new Map();  // Cache textures by "width,height" key

// ============================================================================
// Blur Parameters
// ============================================================================

const BlurMode = {
    BOX: 'box',
    TENT: 'tent',
    GAUSSIAN: 'gaussian',
    DUAL_KAWASE: 'dual_kawase',
    SPLIT_KAWASE: 'split_kawase',
};

const blurParams = {
    mode: BlurMode.BOX,
    radiusX: 10,
    radiusY: 10,
    lockRadius: true,
    // Split Kawase filter configs (matching C++ defaults)
    splitCfgDown: { w00: 2.120, w05: 0.750, w10: 1.300, w15: 0.100, w20: 0.150 },
    splitCfgUp:   { w00: 0.000, w05: 2.800, w10: 0.700, w15: 0.000, w20: 0.010 },
};

// ============================================================================
// Initialization
// ============================================================================

async function initWebGPU() {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    if (!navigator.gpu) {
        errorEl.textContent = 'WebGPU is not supported in this browser.';
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            errorEl.textContent = 'Failed to get WebGPU adapter.';
            return false;
        }

        device = await adapter.requestDevice({
            requiredFeatures: ['float32-filterable', 'float32-blendable'],
        });
        context = canvas.getContext('webgpu');
        canvasFormat = navigator.gpu.getPreferredCanvasFormat();

        context.configure({
            device: device,
            format: canvasFormat,
            alphaMode: 'premultiplied',
        });

        // Create samplers
        sampler = device.createSampler({
            magFilter: 'linear',
            minFilter: 'linear',
            addressModeU: 'clamp-to-edge',
            addressModeV: 'clamp-to-edge',
        });
        samplerNearest = device.createSampler({
            magFilter: 'nearest',
            minFilter: 'nearest',
            addressModeU: 'clamp-to-edge',
            addressModeV: 'clamp-to-edge',
        });

        // Create passthrough pipeline
        const passthroughModule = device.createShaderModule({
            code: PASSTHROUGH_SHADER,
        });

        passthroughPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: passthroughModule,
                entryPoint: 'vs_main',
            },
            fragment: {
                module: passthroughModule,
                entryPoint: 'fs_main',
                targets: [{ format: canvasFormat }],
            },
            primitive: {
                topology: 'triangle-list',
            },
        });

        // Create separable blur pipeline
        const separableModule = device.createShaderModule({
            code: SEPARABLE_BLUR_SHADER,
        });

        separablePipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: separableModule,
                entryPoint: 'vs_main',
            },
            fragment: {
                module: separableModule,
                entryPoint: 'fs_main',
                targets: [{ format: 'rgba32float' }],
            },
            primitive: {
                topology: 'triangle-list',
            },
        });

        // Create Dual Kawase pipelines
        const dkDownModule = device.createShaderModule({ code: DK_DOWNSAMPLE_SHADER });
        const dkUpModule = device.createShaderModule({ code: DK_UPSAMPLE_SHADER });
        const dkMixModule = device.createShaderModule({ code: DK_MIX_SHADER });
        const dkCopyModule = device.createShaderModule({ code: DK_COPY_SHADER });

        dkDownPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: dkDownModule, entryPoint: 'vs_main' },
            fragment: { module: dkDownModule, entryPoint: 'fs_main', targets: [{ format: 'rgba32float' }] },
            primitive: { topology: 'triangle-list' },
        });

        dkUpPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: dkUpModule, entryPoint: 'vs_main' },
            fragment: { module: dkUpModule, entryPoint: 'fs_main', targets: [{ format: 'rgba32float' }] },
            primitive: { topology: 'triangle-list' },
        });

        dkMixPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: dkMixModule, entryPoint: 'vs_main' },
            fragment: {
                module: dkMixModule,
                entryPoint: 'fs_main',
                targets: [{
                    format: 'rgba32float',
                    blend: {
                        color: {
                            srcFactor: 'src-alpha',
                            dstFactor: 'one-minus-src-alpha',
                            operation: 'add',
                        },
                        alpha: {
                            srcFactor: 'src-alpha',
                            dstFactor: 'one-minus-src-alpha',
                            operation: 'add',
                        },
                    },
                }],
            },
            primitive: { topology: 'triangle-list' },
        });

        dkCopyPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: dkCopyModule, entryPoint: 'vs_main' },
            fragment: { module: dkCopyModule, entryPoint: 'fs_main', targets: [{ format: 'rgba32float' }] },
            primitive: { topology: 'triangle-list' },
        });

        // Create Split Kawase pipeline
        const splitKawaseModule = device.createShaderModule({ code: SPLIT_KAWASE_STEP_SHADER });
        splitKawasePipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: splitKawaseModule, entryPoint: 'vs_main' },
            fragment: { module: splitKawaseModule, entryPoint: 'fs_main', targets: [{ format: 'rgba32float' }] },
            primitive: { topology: 'triangle-list' },
        });

        statusEl.textContent = 'WebGPU ready. Load an image to begin.';
        return true;
    } catch (e) {
        errorEl.textContent = `WebGPU initialization failed: ${e.message}`;
        return false;
    }
}

// ============================================================================
// Image Loading
// ============================================================================

// sRGB to linear conversion
function srgbToLinear(value) {
    const v = value / 255.0;
    if (v <= 0.04045) {
        return v / 12.92;
    }
    return Math.pow((v + 0.055) / 1.055, 2.4);
}

async function loadImage(file) {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(img.src);
            reject(new Error('Failed to load image'));
        };
        img.src = URL.createObjectURL(file);
    });
}

function imageToLinearFloat(img) {
    // Draw image to temp canvas to get pixel data
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const ctx = tempCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, img.width, img.height);
    const pixels = imageData.data;

    // Convert to linear float RGBA
    const floatData = new Float32Array(img.width * img.height * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        const idx = i;
        floatData[idx + 0] = srgbToLinear(pixels[i + 0]);
        floatData[idx + 1] = srgbToLinear(pixels[i + 1]);
        floatData[idx + 2] = srgbToLinear(pixels[i + 2]);
        floatData[idx + 3] = pixels[i + 3] / 255.0;
    }

    return { data: floatData, width: img.width, height: img.height };
}

function createTextureFromLinearData(linearData) {
    const { data, width, height } = linearData;

    // Destroy old texture if exists
    if (imageTexture) {
        imageTexture.destroy();
    }

    // Clear cached textures (pyramid sizes depend on image size)
    clearTextureCache();

    imageTexture = device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
    });

    device.queue.writeTexture(
        { texture: imageTexture },
        data,
        { bytesPerRow: width * 4 * 4 },
        { width, height }
    );

    // Create bind group
    bindGroup = device.createBindGroup({
        layout: passthroughPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: imageTexture.createView() },
        ],
    });

    return { width, height };
}

async function handleImageFile(file) {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    try {
        statusEl.textContent = 'Loading image...';

        const img = await loadImage(file);
        statusEl.textContent = `Converting to linear (${img.width}x${img.height})...`;

        const linearData = imageToLinearFloat(img);
        statusEl.textContent = 'Uploading to GPU...';

        const { width, height } = createTextureFromLinearData(linearData);

        // Resize canvas to match image (internal resolution)
        canvas.width = width;
        canvas.height = height;
        context.configure({
            device: device,
            format: canvasFormat,
            alphaMode: 'premultiplied',
        });

        // Store size and constrain display to fit viewport
        currentImageSize = { width, height };
        fitCanvasToViewport(width, height);

        // Render
        render();

        statusEl.textContent = `Loaded: ${file.name} (${width}x${height})`;
    } catch (e) {
        errorEl.textContent = `Error: ${e.message}`;
        statusEl.textContent = 'Failed to load image.';
    }
}

// ============================================================================
// Blur Kernel Calculation
// ============================================================================

function separableKernelValue(mode, x) {
    x = Math.abs(x);
    switch (mode) {
        case BlurMode.BOX:
            return x > 1.0 ? 0.0 : 1.0;
        case BlurMode.TENT:
            return x > 1.0 ? 0.0 : 1.0 - x;
        case BlurMode.GAUSSIAN: {
            const scale = 1.6;
            const twoScale2 = 2.0 * scale * scale;
            x *= 3.0 * scale;
            return (1.0 / Math.sqrt(Math.PI * twoScale2)) * Math.exp(-x * x / twoScale2);
        }
        default:
            return 0.0;
    }
}

function calcSeparableWeights(mode, radius) {
    // Kernel size is radius+1, but since it is symmetric we only store one half
    const size = Math.ceil(radius) + 1;
    const weights = new Float32Array(size);

    let sum = 0.0;

    // Center weight
    const centerWeight = separableKernelValue(mode, 0.0);
    weights[0] = centerWeight;
    sum += centerWeight;

    // Other weights in the positive direction
    // Add double to the sum to account for negative direction
    const scale = radius > 0.0 ? 1.0 / radius : 0.0;
    for (let i = 1; i < size; i++) {
        const weight = separableKernelValue(mode, i * scale);
        weights[i] = weight;
        sum += weight * 2.0;
    }

    // Normalize the weights
    for (let i = 0; i < size; i++) {
        weights[i] /= sum;
    }

    // Create 1D texture for kernel weights
    const kernelTexture = device.createTexture({
        size: [size],
        format: 'r32float',
        dimension: '1d',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
    });

    device.queue.writeTexture(
        { texture: kernelTexture },
        weights,
        { bytesPerRow: size * 4 },
        { width: size }
    );

    return { texture: kernelTexture, width: size };
}

function separablePass(commandEncoder, input, output, mode, horizontal, radius) {
    const width = currentImageSize.width;
    const height = currentImageSize.height;

    // Calculate kernel weights
    const kernel = calcSeparableWeights(mode, radius);

    // Create uniform buffer for blur params
    const paramsData = new ArrayBuffer(16); // vec2f (8) + i32 (4) + padding (4)
    const paramsView = new DataView(paramsData);
    paramsView.setFloat32(0, horizontal ? 1.0 / width : 0.0, true);
    paramsView.setFloat32(4, horizontal ? 0.0 : 1.0 / height, true);
    paramsView.setInt32(8, kernel.width, true);

    const paramsBuffer = device.createBuffer({
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    // Create bind group for this pass
    const blurBindGroup = device.createBindGroup({
        layout: separablePipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: kernel.texture.createView() },
            { binding: 3, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(separablePipeline);
    renderPass.setBindGroup(0, blurBindGroup);
    renderPass.draw(3);
    renderPass.end();

    // Resources (kernel texture, params buffer) will be garbage collected after GPU is done
}

function ensureBlurTextures(width, height) {
    // Create or recreate temp and output textures if size changed
    if (blurTempTexture && blurTempTexture.width === width && blurTempTexture.height === height) {
        return;
    }

    if (blurTempTexture) blurTempTexture.destroy();
    if (blurOutputTexture) blurOutputTexture.destroy();

    blurTempTexture = device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
    });

    blurOutputTexture = device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
    });
}

// ============================================================================
// Dual Kawase Blur
// ============================================================================

function createDKTexture(width, height) {
    return device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
    });
}

// Get a uniform buffer from pool (creates if needed)
function getKawaseUniformBuffer(size) {
    if (kawaseUniformBufferIndex >= kawaseUniformBuffers.length) {
        kawaseUniformBuffers.push(device.createBuffer({
            size: 32,  // Max size needed (Split Kawase params)
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        }));
    }
    return kawaseUniformBuffers[kawaseUniformBufferIndex++];
}

// Reset uniform buffer pool index at start of frame
function resetKawaseUniformBufferPool() {
    kawaseUniformBufferIndex = 0;
}

// Get a cached texture of given size (creates if not exists)
function getCachedTexture(width, height) {
    const key = `${width},${height}`;
    let textures = kawaseTextureCache.get(key);
    if (!textures) {
        textures = [];
        kawaseTextureCache.set(key, textures);
    }
    // Find an unused texture or create new one
    for (const entry of textures) {
        if (!entry.inUse) {
            entry.inUse = true;
            return entry.texture;
        }
    }
    // Create new texture
    const texture = createDKTexture(width, height);
    textures.push({ texture, inUse: true });
    return texture;
}

// Mark all cached textures as unused (call at start of frame)
function resetTextureCache() {
    for (const textures of kawaseTextureCache.values()) {
        for (const entry of textures) {
            entry.inUse = false;
        }
    }
}

// Clear texture cache (call when image size changes)
function clearTextureCache() {
    for (const textures of kawaseTextureCache.values()) {
        for (const entry of textures) {
            entry.texture.destroy();
        }
    }
    kawaseTextureCache.clear();
}

function kawaseDownsample(commandEncoder, input, fullSizeX, fullSizeY, divisor, ratio) {
    const sizeX = Math.max(Math.floor(fullSizeX / divisor), 1);
    const sizeY = Math.max(Math.floor(fullSizeY / divisor), 1);
    const output = getCachedTexture(sizeX, sizeY);

    // Note: "step" is based on *output* size, which is 2x smaller than input
    const stepX = ratio / sizeX;
    const stepY = ratio / sizeY;

    const paramsData = new Float32Array([stepX, stepY]);
    const paramsBuffer = getKawaseUniformBuffer();
    device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = device.createBindGroup({
        layout: dkDownPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(dkDownPipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function kawaseUpsample(commandEncoder, input, fullSizeX, fullSizeY, divisor, ratio, existingOutput = null) {
    const sizeX = Math.max(Math.floor(fullSizeX / divisor), 1);
    const sizeY = Math.max(Math.floor(fullSizeY / divisor), 1);
    const output = existingOutput || getCachedTexture(sizeX, sizeY);

    // Note: "step" is based on *input* size, which is 2x smaller than output
    const stepX = ratio / input.width;
    const stepY = ratio / input.height;

    const paramsData = new Float32Array([stepX, stepY]);
    const paramsBuffer = getKawaseUniformBuffer();
    device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = device.createBindGroup({
        layout: dkUpPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(dkUpPipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function kawaseMix(commandEncoder, input, output, ratio) {
    const paramsData = new Float32Array([ratio]);
    const paramsBuffer = getKawaseUniformBuffer();
    device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = device.createBindGroup({
        layout: dkMixPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: samplerNearest },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'load',  // Important: load existing content for blending
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(dkMixPipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();
}

function kawaseCopy(commandEncoder, input, output) {
    const bindGroup = device.createBindGroup({
        layout: dkCopyPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: samplerNearest },
            { binding: 1, resource: input.createView() },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(dkCopyPipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();
}

function blurDualKawase(commandEncoder, input, output) {
    // Dual Kawase is isotropic, so blur based on max(x,y)
    const radius = Math.max(blurParams.radiusX, blurParams.radiusY);

    // Amount of Kawase "steps" to do; this more or less matches the blur amount of Gaussian
    const numSteps = radius / 3.0;
    if (numSteps <= 0.0) {
        kawaseCopy(commandEncoder, input, output);
        return;
    }

    const fullSizeX = currentImageSize.width;
    const fullSizeY = currentImageSize.height;

    let curr = input;

    // Downsample
    let lastPass = 0;
    for (let i = 2; i <= numSteps; i *= 2) {
        curr = kawaseDownsample(commandEncoder, curr, fullSizeX, fullSizeY, i, 1.0);
        lastPass = i;
    }

    let residual = numSteps - lastPass;
    if (residual > 0.0) {
        let nextPass = Math.max(lastPass, 1) * 2;
        let ratio = residual / (nextPass - lastPass);
        lastPass = Math.max(lastPass, 1);

        // Downsample and upsample one more step
        const extraDown = kawaseDownsample(commandEncoder, curr, fullSizeX, fullSizeY, nextPass, 0.5 + 0.5 * ratio);
        const extraUp = kawaseUpsample(commandEncoder, extraDown, fullSizeX, fullSizeY, lastPass, 0.5 + 0.5 * ratio);

        // Mix current with that extra step based on ratio
        kawaseMix(commandEncoder, curr, extraUp, 1.0 - ratio);
        curr = extraUp;

        // If there will be no further upsamples, copy to output
        if (lastPass < 2) {
            kawaseCopy(commandEncoder, curr, output);
            return;
        }
    }

    // Upsample
    for (let i = Math.floor(lastPass / 2); i >= 1; i = Math.floor(i / 2)) {
        const isLast = i === 1;
        curr = kawaseUpsample(commandEncoder, curr, fullSizeX, fullSizeY, i, 1.0, isLast ? output : null);
    }
}

// ============================================================================
// Split Kawase Blur
// ============================================================================

function splitKawaseStep(commandEncoder, cfg, input, fullSizeX, fullSizeY, divisor, horizontal) {
    const sizeX = horizontal ? Math.max(Math.floor(fullSizeX / divisor), 1) : fullSizeX;
    const sizeY = horizontal ? fullSizeY : Math.max(Math.floor(fullSizeY / divisor), 1);
    const output = getCachedTexture(sizeX, sizeY);

    // X or Y component is set to zero based on whether we are doing horizontal or vertical pass
    const stepX = horizontal ? 1.0 / input.width : 0.0;
    const stepY = horizontal ? 0.0 : 1.0 / input.height;

    // Params: uvStep (vec2f = 8 bytes) + w00, w05, w10, w15, w20 (5 * f32 = 20 bytes) = 28 bytes, padded to 32
    const paramsData = new Float32Array([stepX, stepY, cfg.w00, cfg.w05, cfg.w10, cfg.w15, cfg.w20, 0.0]);
    const paramsBuffer = getKawaseUniformBuffer();
    device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = device.createBindGroup({
        layout: splitKawasePipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(splitKawasePipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function splitKawaseAxis(commandEncoder, cfgDown, cfgUp, input, output, radius, horizontal) {
    // Amount of Kawase "steps" to do; this more or less matches the blur amount of Gaussian
    const numSteps = radius / 3.0;

    const fullSizeX = currentImageSize.width;
    const fullSizeY = currentImageSize.height;

    let curr = input;

    // Downsample
    let lastPass = 0;
    for (let i = 2; i <= numSteps; i *= 2) {
        curr = splitKawaseStep(commandEncoder, cfgDown, curr, fullSizeX, fullSizeY, i, horizontal);
        lastPass = i;
    }

    let residual = numSteps - lastPass;
    if (residual > 0.0) {
        let nextPass = Math.max(lastPass, 1) * 2;
        let ratio = residual / (nextPass - lastPass);
        lastPass = Math.max(lastPass, 1);

        // Downsample and upsample one more step
        const extraDown = splitKawaseStep(commandEncoder, cfgDown, curr, fullSizeX, fullSizeY, nextPass, horizontal);
        const extraUp = splitKawaseStep(commandEncoder, cfgUp, extraDown, fullSizeX, fullSizeY, lastPass, horizontal);

        // Mix current with that extra step based on ratio
        kawaseMix(commandEncoder, curr, extraUp, 1.0 - ratio);
        curr = extraUp;
    }

    // Upsample
    for (let i = Math.floor(lastPass / 2); i >= 1; i = Math.floor(i / 2)) {
        curr = splitKawaseStep(commandEncoder, cfgUp, curr, fullSizeX, fullSizeY, i, horizontal);
    }

    // Copy to output
    kawaseCopy(commandEncoder, curr, output);
}

function blurSplitKawase(commandEncoder, input, output) {
    // Get temp texture for intermediate result between X and Y passes
    const tmp = getCachedTexture(currentImageSize.width, currentImageSize.height);

    // Horizontal pass: input -> tmp
    splitKawaseAxis(commandEncoder, blurParams.splitCfgDown, blurParams.splitCfgUp,
        input, tmp, blurParams.radiusX, true);

    // Vertical pass: tmp -> output
    splitKawaseAxis(commandEncoder, blurParams.splitCfgDown, blurParams.splitCfgUp,
        tmp, output, blurParams.radiusY, false);
}

// ============================================================================
// Canvas Sizing
// ============================================================================

function fitCanvasToViewport(imageWidth, imageHeight) {
    const canvas = document.getElementById('canvas');
    const margin = 40; // pixels of margin around canvas

    // Available space (viewport minus controls and margins)
    const controlsHeight = document.querySelector('.controls').offsetHeight;
    const maxWidth = window.innerWidth - margin * 2;
    const maxHeight = window.innerHeight - controlsHeight - margin * 3;

    // Calculate scale to fit
    const scaleX = maxWidth / imageWidth;
    const scaleY = maxHeight / imageHeight;
    const scale = Math.min(scaleX, scaleY, 1.0); // Never upscale

    canvas.style.width = Math.floor(imageWidth * scale) + 'px';
    canvas.style.height = Math.floor(imageHeight * scale) + 'px';
}

// ============================================================================
// Rendering
// ============================================================================

function render() {
    if (!device || !imageTexture) return;

    const { width, height } = currentImageSize;
    if (width === 0 || height === 0) return;

    // Ensure blur textures exist
    ensureBlurTextures(width, height);

    // Reset resource pools for this frame
    resetKawaseUniformBufferPool();
    resetTextureCache();

    const commandEncoder = device.createCommandEncoder();

    // Determine which texture to display
    let textureToDisplay = imageTexture;

    // Apply blur if radius > 0
    if (blurParams.radiusX > 0 || blurParams.radiusY > 0) {
        if (blurParams.mode === BlurMode.DUAL_KAWASE) {
            // Dual Kawase blur
            blurDualKawase(commandEncoder, imageTexture, blurOutputTexture);
            textureToDisplay = blurOutputTexture;
        } else if (blurParams.mode === BlurMode.SPLIT_KAWASE) {
            // Split Kawase blur
            blurSplitKawase(commandEncoder, imageTexture, blurOutputTexture);
            textureToDisplay = blurOutputTexture;
        } else {
            // Separable blur (Box, Tent, Gaussian)
            // Horizontal pass: input -> temp
            if (blurParams.radiusX > 0) {
                separablePass(commandEncoder, imageTexture, blurTempTexture, blurParams.mode, true, blurParams.radiusX);
            }

            // Vertical pass: temp -> output (or input -> output if no horizontal)
            if (blurParams.radiusY > 0) {
                const vertInput = blurParams.radiusX > 0 ? blurTempTexture : imageTexture;
                separablePass(commandEncoder, vertInput, blurOutputTexture, blurParams.mode, false, blurParams.radiusY);
                textureToDisplay = blurOutputTexture;
            } else {
                textureToDisplay = blurTempTexture;
            }
        }
    }

    // Create bind group for final display
    const displayBindGroup = device.createBindGroup({
        layout: passthroughPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: textureToDisplay.createView() },
        ],
    });

    // Final pass: render to screen with sRGB conversion
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(passthroughPipeline);
    renderPass.setBindGroup(0, displayBindGroup);
    renderPass.draw(3);
    renderPass.end();

    device.queue.submit([commandEncoder.finish()]);
}

// ============================================================================
// Event Handlers
// ============================================================================

function setupEventHandlers() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    // Click to browse
    dropzone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageFile(e.target.files[0]);
        }
    });

    // Window resize
    window.addEventListener('resize', () => {
        if (currentImageSize.width > 0) {
            fitCanvasToViewport(currentImageSize.width, currentImageSize.height);
        }
    });

    // Drag and drop
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            if (file.type === 'image/png' || file.type === 'image/jpeg') {
                handleImageFile(file);
            } else {
                document.getElementById('error').textContent = 'Please drop a PNG or JPEG file.';
            }
        }
    });

    // Blur mode radio buttons
    document.querySelectorAll('input[name="blurMode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            blurParams.mode = e.target.value;
            onBlurParamsChanged();
        });
    });

    // Radius X slider
    const radiusX = document.getElementById('radiusX');
    const radiusXValue = document.getElementById('radiusXValue');
    const radiusY = document.getElementById('radiusY');
    const radiusYValue = document.getElementById('radiusYValue');
    const radiusYRow = document.getElementById('radiusYRow');
    const lockRadius = document.getElementById('lockRadius');

    radiusX.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        blurParams.radiusX = value;
        radiusXValue.textContent = value;

        if (blurParams.lockRadius) {
            blurParams.radiusY = value;
            radiusY.value = value;
            radiusYValue.textContent = value;
        }
        onBlurParamsChanged();
    });

    // Radius Y slider
    radiusY.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        blurParams.radiusY = value;
        radiusYValue.textContent = value;
        onBlurParamsChanged();
    });

    // Lock checkbox
    lockRadius.addEventListener('change', (e) => {
        blurParams.lockRadius = e.target.checked;
        radiusY.disabled = e.target.checked;
        radiusYRow.classList.toggle('disabled', e.target.checked);

        if (e.target.checked) {
            // Sync Y to X when locking
            blurParams.radiusY = blurParams.radiusX;
            radiusY.value = blurParams.radiusX;
            radiusYValue.textContent = blurParams.radiusX;
            onBlurParamsChanged();
        }
    });
}

function onBlurParamsChanged() {
    render();
}

// ============================================================================
// Main
// ============================================================================

async function main() {
    setupEventHandlers();
    await initWebGPU();
}

main();
</script>
