<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Playground</title>
<style>
* {
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 10px;
    background: #1a1a1a;
    color: #e0e0e0;
}
.controls {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: flex-start;
}
.dropzone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 10px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
    max-width: 140px;
    line-height: 1.4;
}
.dropzone:hover, .dropzone.dragover {
    border-color: #888;
    background-color: #252525;
}
.dropzone input {
    display: none;
}
#canvas {
    border: 1px solid #333;
    max-width: 100%;
    background: #000;
}
#status {
    margin-top: 10px;
    color: #888;
}
#error {
    color: #ff6b6b;
    margin-top: 10px;
}
.control-group {
    background: #252525;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.control-group label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.radio-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
}
.slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.slider-row label {
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
}
.slider-row input[type="range"] {
    flex: 1;
    min-width: 150px;
}
.slider-row .value {
    min-width: 2.5em;
    text-align: right;
    font-family: monospace;
}
.slider-row.disabled label,
.slider-row.disabled .value {
    color: #555;
}
.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.checkbox-row label {
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
    cursor: pointer;
}
.weight-controls {
    opacity: 0.4;
    pointer-events: none;
}
.weight-controls.enabled {
    opacity: 1;
    pointer-events: auto;
}
.weight-groups-container {
    display: flex;
    gap: 20px;
}
.weight-group {
    flex: 1;
}
.weight-group-label {
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
}
.weight-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
}
.weight-row label {
    min-width: 30px;
    font-size: 11px;
    color: #aaa;
    text-transform: none;
}
.weight-row input[type="range"] {
    flex: 1;
    min-width: 60px;
}
.weight-row .value {
    min-width: 35px;
    font-size: 11px;
    font-family: monospace;
    text-align: right;
}
.reset-btn {
    background: #444;
    border: 1px solid #666;
    color: #e0e0e0;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 8px;
}
.reset-btn:hover {
    background: #555;
}
</style>
</head>
<body>
<div class="controls">
    <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/png,image/jpeg,.exr">
        <span>Click to browse or drag & drop PNG/JPG/EXR</span>
    </div>

    <div class="control-group">
        <label>Blur Mode</label>
        <div class="radio-group">
            <label><input type="radio" name="blurMode" value="box"> Box</label>
            <label><input type="radio" name="blurMode" value="tent"> Tent</label>
            <label><input type="radio" name="blurMode" value="gaussian"> Gaussian</label>
            <label><input type="radio" name="blurMode" value="dual_kawase" checked> Dual Kawase</label>
            <label><input type="radio" name="blurMode" value="split_kawase"> Split Kawase</label>
        </div>
    </div>

    <div class="control-group">
        <label>Blur Radius</label>
        <div class="slider-row">
            <label for="radiusX">X:</label>
            <input type="range" id="radiusX" min="0" max="500" value="10">
            <span class="value" id="radiusXValue">10</span>
        </div>
        <div class="slider-row disabled" id="radiusYRow">
            <label for="radiusY">Y:</label>
            <input type="range" id="radiusY" min="0" max="500" value="10" disabled>
            <span class="value" id="radiusYValue">10</span>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="lockRadius" checked>
            <label for="lockRadius">Lock X & Y</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="lockPow2">
            <label for="lockPow2">Snap to 3×2ⁿ</label>
        </div>
    </div>

    <div class="control-group weight-controls" id="splitKawaseControls">
        <label>Split Kawase Weights</label>
        <div class="weight-groups-container">
        <div class="weight-group">
            <div class="weight-group-label">Downsample</div>
            <div class="weight-row">
                <label>0.0:</label>
                <input type="range" id="downW00" min="0" max="4" step="0.01" value="2.12">
                <span class="value" id="downW00Value">2.12</span>
            </div>
            <div class="weight-row">
                <label>0.5:</label>
                <input type="range" id="downW05" min="0" max="4" step="0.01" value="0.75">
                <span class="value" id="downW05Value">0.75</span>
            </div>
            <div class="weight-row">
                <label>1.0:</label>
                <input type="range" id="downW10" min="0" max="4" step="0.01" value="1.30">
                <span class="value" id="downW10Value">1.30</span>
            </div>
            <div class="weight-row">
                <label>1.5:</label>
                <input type="range" id="downW15" min="0" max="4" step="0.01" value="0.10">
                <span class="value" id="downW15Value">0.10</span>
            </div>
            <div class="weight-row">
                <label>2.0:</label>
                <input type="range" id="downW20" min="0" max="4" step="0.01" value="0.15">
                <span class="value" id="downW20Value">0.15</span>
            </div>
        </div>
        <div class="weight-group">
            <div class="weight-group-label">Upsample</div>
            <div class="weight-row">
                <label>0.0:</label>
                <input type="range" id="upW00" min="0" max="4" step="0.01" value="0.00">
                <span class="value" id="upW00Value">0.00</span>
            </div>
            <div class="weight-row">
                <label>0.5:</label>
                <input type="range" id="upW05" min="0" max="4" step="0.01" value="2.80">
                <span class="value" id="upW05Value">2.80</span>
            </div>
            <div class="weight-row">
                <label>1.0:</label>
                <input type="range" id="upW10" min="0" max="4" step="0.01" value="0.70">
                <span class="value" id="upW10Value">0.70</span>
            </div>
            <div class="weight-row">
                <label>1.5:</label>
                <input type="range" id="upW15" min="0" max="4" step="0.01" value="0.00">
                <span class="value" id="upW15Value">0.00</span>
            </div>
            <div class="weight-row">
                <label>2.0:</label>
                <input type="range" id="upW20" min="0" max="4" step="0.01" value="0.01">
                <span class="value" id="upW20Value">0.01</span>
            </div>
        </div>
        </div>
        <button class="reset-btn" id="resetWeights">Reset to Defaults</button>
    </div>
</div>
<canvas id="canvas" width="800" height="600"></canvas>
<div id="status">WebGPU initializing...</div>
<div id="error"></div>

<script src="fflate.js"></script>
<script src="exrloader.js"></script>
<script>
// ================ Shaders
const FULLSCREEN_VERTEX_SHADER = `
struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f,
}
@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VertexOutput {
    var o: VertexOutput;
    // full-screen triangle
    o.uv = vec2f(select(0.0, 2.0, (vid & 1u) != 0u), select(1.0, -1.0, (vid & 2u) != 0u));
    o.position = vec4f(o.uv.x * 2.0 - 1.0, -(o.uv.y * 2.0 - 1.0), 0.0, 1.0);
    return o;
}
`;

const DISPLAY_SHADER = FULLSCREEN_VERTEX_SHADER + `
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
fn linearToSrgb(x: vec3f) -> vec3f {
    return select(
        vec3f(1.055) * pow(x, vec3f(1.0/2.4)) - vec3f(0.055),
        x * vec3f(12.92),
        x < vec3f(0.0031308));
}
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let color = textureSample(tex, smp, in.uv);
    return vec4f(linearToSrgb(color.rgb), color.a);
}
`;

const SEPARABLE_BLUR_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct BlurParams {
    uvStep: vec2f,
    kernelWidth: i32,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var texKernel: texture_1d<f32>;
@group(0) @binding(3) var<uniform> params: BlurParams;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = textureSample(tex, smp, in.uv) * textureLoad(texKernel, 0, 0).r;
    for (var i: i32 = 1; i < params.kernelWidth; i++) {
        let w = textureLoad(texKernel, i, 0).r;
        let offset = params.uvStep * f32(i);
        col += textureSample(tex, smp, in.uv - offset) * w;
        col += textureSample(tex, smp, in.uv + offset) * w;
    }
    return col;
}
`;

const DK_DOWNSAMPLE_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, smp, in.uv) * 4.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5, -0.5));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5,  0.5));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5, -0.5));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5,  0.5));
    return col / 8.0;
}
`;

const DK_UPSAMPLE_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.0, -1.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.0,  1.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-1.0,  0.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 1.0,  0.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5, -0.5)) * 2.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5,  0.5)) * 2.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5, -0.5)) * 2.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5,  0.5)) * 2.0;
    return col / 12.0;
}
`;

const DK_MIX_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    ratio: f32,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let col = textureSample(tex, smp, in.uv);
    return vec4f(col.rgb, params.ratio);
}
`;

const SPLIT_KAWASE_STEP_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
    w00: f32,
    w05: f32,
    w10: f32,
    w15: f32,
    w20: f32,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, smp, in.uv) * params.w00;
    col += textureSample(tex, smp, in.uv + params.uvStep * (-0.5)) * params.w05;
    col += textureSample(tex, smp, in.uv + params.uvStep * ( 0.5)) * params.w05;
    col += textureSample(tex, smp, in.uv + params.uvStep * (-1.0)) * params.w10;
    col += textureSample(tex, smp, in.uv + params.uvStep * ( 1.0)) * params.w10;
    col += textureSample(tex, smp, in.uv + params.uvStep * (-1.5)) * params.w15;
    col += textureSample(tex, smp, in.uv + params.uvStep * ( 1.5)) * params.w15;
    col += textureSample(tex, smp, in.uv + params.uvStep * (-2.0)) * params.w20;
    col += textureSample(tex, smp, in.uv + params.uvStep * ( 2.0)) * params.w20;
    let wsum = params.w00 + (params.w05 + params.w10 + params.w15 + params.w20) * 2.0;
    return col / wsum;
}
`;

// ================ WebGPU state

/** @type {GPUDevice} */
let gpu_device = null;
/** @type {GPUCanvasContext} */
let gpu_ctx = null;
/** @type {GPUTextureFormat} */
let gpu_canvas_format = null;
/** @type {GPUSampler} */
let gpu_sampler_linear = null;
/** @type {GPUSampler} */
let gpu_sampler_point = null;
/** @type {GPUBindGroup} */
let gpu_bind_group = null;
/** @type {GPUTexture} */
let tex_source = null;
/** @type {GPUTexture} */
let tex_blurred = null;
/** @type {GPUTexture} */
let tex_blur_tmp = null;
/** @type {GPURenderPipeline} */
let pip_display = null;
/** @type {GPURenderPipeline} */
let pip_separable = null;
/** @type {GPURenderPipeline} */
let pip_dk_down = null;
/** @type {GPURenderPipeline} */
let pip_dk_up = null;
/** @type {GPURenderPipeline} */
let pip_dk_mix = null;
/** @type {GPURenderPipeline} */
let pip_split_kaw = null;

let cur_image_size = { width: 0, height: 0 };

// Reusable resources for Kawase blurs
/** @type {GPUBuffer[]} */
let kawaseUniformBuffers = [];
let kawaseUniformBufferIndex = 0;
/** @type {Map<string, GPUTexture>} */
let kawaseTextureCache = new Map();

// ================ Various helpers

function createTexture2D(width, height) {
    return gpu_device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC | GPUTextureUsage.COPY_DST,
    });
}

function createSampler(filter) {
    return gpu_device.createSampler({
        magFilter: filter,
        minFilter: filter,
        addressModeU: 'clamp-to-edge',
        addressModeV: 'clamp-to-edge',
    })
}

function createPipeline(codeString, rtFormat = 'rgba32float', blending = false) {
    const shader_mod = gpu_device.createShaderModule({
        code: codeString,
    });
    const target = { format: rtFormat };
    if (blending) {
        target.blend = {
            color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add', },
            alpha: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add', },
        };
    }
    return gpu_device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shader_mod, entryPoint: 'vs_main', },
        fragment: { module: shader_mod, entryPoint: 'fs_main', targets: [target], },
        primitive: { topology: 'triangle-list', },
    })
}

function fitCanvasToViewport(imageWidth, imageHeight) {
    const canvas = document.getElementById('canvas');
    const margin = 20; // pixels of margin around canvas

    // Available space (viewport minus controls and margins)
    const controlsHeight = document.querySelector('.controls').offsetHeight;
    const maxWidth = window.innerWidth - margin * 2;
    const maxHeight = window.innerHeight - controlsHeight - margin * 3;

    // Calculate scale to fit
    const scaleX = maxWidth / imageWidth;
    const scaleY = maxHeight / imageHeight;
    const scale = Math.min(scaleX, scaleY, 4.0); // don't scale up by more than 4x

    canvas.style.width = Math.floor(imageWidth * scale) + 'px';
    canvas.style.height = Math.floor(imageHeight * scale) + 'px';
}

// ================ Blur parameters

const BlurMode = {
    BOX: 'box',
    TENT: 'tent',
    GAUSSIAN: 'gaussian',
    DUAL_KAWASE: 'dual_kawase',
    SPLIT_KAWASE: 'split_kawase',
};

const blur_params = {
    mode: BlurMode.DUAL_KAWASE,
    radius_x: 10,
    radius_y: 10,
    lock_radius: true,
    lock_pow2: false,
    // Split Kawase filter configs
    split_cfg_down: { w00: 2.120, w05: 0.750, w10: 1.300, w15: 0.100, w20: 0.150 },
    split_cfg_up:   { w00: 0.000, w05: 2.800, w10: 0.700, w15: 0.000, w20: 0.010 },
};

// These are 3 * powers of two, which for the Kawase variants means there is
// no "residual blending" step done.
const POW2_RADII = [3, 6, 12, 24, 48, 96, 192, 384, 768, 1536, 3072, 6144, 12288];

function snapToPow2Radius(value) {
    if (value <= 0) return 3;
    let closest = POW2_RADII[0];
    let minDist = Math.abs(value - closest);
    for (const r of POW2_RADII) {
        const dist = Math.abs(value - r);
        if (dist < minDist) {
            minDist = dist;
            closest = r;
        }
    }
    return closest;
}

// ================ Initialization

async function initWebGPU() {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    if (!navigator.gpu) {
        errorEl.textContent = 'WebGPU is not supported in this browser.';
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            errorEl.textContent = 'Failed to get WebGPU adapter.';
            return false;
        }

        gpu_device = await adapter.requestDevice({
            requiredFeatures: ['float32-filterable', 'float32-blendable'],
        });
        gpu_ctx = canvas.getContext('webgpu');
        gpu_canvas_format = navigator.gpu.getPreferredCanvasFormat();

        gpu_ctx.configure({
            device: gpu_device,
            format: gpu_canvas_format,
            alphaMode: 'premultiplied',
        });

        gpu_sampler_linear = createSampler('linear');
        gpu_sampler_point = createSampler('nearest');

        pip_display = createPipeline(DISPLAY_SHADER, gpu_canvas_format);
        pip_separable = createPipeline(SEPARABLE_BLUR_SHADER);
        pip_dk_down = createPipeline(DK_DOWNSAMPLE_SHADER);
        pip_dk_up = createPipeline(DK_UPSAMPLE_SHADER);
        pip_split_kaw = createPipeline(SPLIT_KAWASE_STEP_SHADER);
        pip_dk_mix = createPipeline(DK_MIX_SHADER, undefined, true);

        statusEl.textContent = 'WebGPU ready. Load an image to begin.';
        return true;
    } catch (e) {
        errorEl.textContent = `WebGPU initialization failed: ${e.message}`;
        return false;
    }
}

// ================ Image loading

// sRGB to linear conversion
function srgbToLinear(value) {
    const v = value / 255.0;
    if (v <= 0.04045) {
        return v / 12.92;
    }
    return Math.pow((v + 0.055) / 1.055, 2.4);
}

async function loadImage(file) {
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(img.src);
            reject(new Error('Failed to load image'));
        };
        img.src = URL.createObjectURL(file);
    });
}

function imageToLinearFloat(img) {
    // Draw image to temp canvas to get pixel data
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const ctx = tempCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, img.width, img.height);
    const pixels = imageData.data;

    // Convert to linear float RGBA
    const floatData = new Float32Array(img.width * img.height * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        const idx = i;
        floatData[idx + 0] = srgbToLinear(pixels[i + 0]);
        floatData[idx + 1] = srgbToLinear(pixels[i + 1]);
        floatData[idx + 2] = srgbToLinear(pixels[i + 2]);
        floatData[idx + 3] = pixels[i + 3] / 255.0;
    }

    return { data: floatData, width: img.width, height: img.height };
}

function createTextureFromLinearData(linearData) {
    const { data, width, height } = linearData;

    // Destroy old texture if exists
    if (tex_source) {
        tex_source.destroy();
    }

    // Clear cached textures (pyramid sizes depend on image size)
    clearTextureCache();

    tex_source = createTexture2D(width, height);

    gpu_device.queue.writeTexture(
        { texture: tex_source },
        data,
        { bytesPerRow: width * 4 * 4 },
        { width, height }
    );

    // Create bind group
    gpu_bind_group = gpu_device.createBindGroup({
        layout: pip_display.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: tex_source.createView() },
        ],
    });

    return { width, height };
}

async function loadEXR(file) {
    const arrayBuffer = await file.arrayBuffer();
    const result = window.parseEXR(arrayBuffer);

    // EXR files are stored bottom-to-top, flip vertically
    const { width, height, data } = result;
    const flipped = new Float32Array(data.length);
    const rowSize = width * 4; // RGBA
    for (let y = 0; y < height; y++) {
        const srcRow = (height - 1 - y) * rowSize;
        const dstRow = y * rowSize;
        flipped.set(data.subarray(srcRow, srcRow + rowSize), dstRow);
    }

    return { data: flipped, width, height };
}

async function handleImageFile(file) {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    try {
        statusEl.textContent = 'Loading image...';

        let linearData;
        const isEXR = file.name.toLowerCase().endsWith('.exr');

        if (isEXR) {
            statusEl.textContent = 'Parsing EXR file...';
            linearData = await loadEXR(file);
            statusEl.textContent = `Loaded EXR (${linearData.width}x${linearData.height})`;
        } else {
            const img = await loadImage(file);
            statusEl.textContent = `Converting to linear (${img.width}x${img.height})...`;
            linearData = imageToLinearFloat(img);
        }

        statusEl.textContent = 'Uploading to GPU...';

        const { width, height } = createTextureFromLinearData(linearData);

        // Resize canvas to match image (internal resolution)
        canvas.width = width;
        canvas.height = height;
        gpu_ctx.configure({
            device: gpu_device,
            format: gpu_canvas_format,
            alphaMode: 'premultiplied',
        });

        // Store size and constrain display to fit viewport
        cur_image_size = { width, height };
        fitCanvasToViewport(width, height);

        // Render
        render();

        statusEl.textContent = `Loaded: ${file.name} (${width}x${height})`;
    } catch (e) {
        errorEl.textContent = `Error: ${e.message}`;
        statusEl.textContent = 'Failed to load image.';
        console.error('Image load error:', e);
    }
}

// ================ Blur kernel utilities

function separableKernelValue(mode, x) {
    x = Math.abs(x);
    switch (mode) {
        case BlurMode.BOX:
            return x > 1.0 ? 0.0 : 1.0;
        case BlurMode.TENT:
            return x > 1.0 ? 0.0 : 1.0 - x;
        case BlurMode.GAUSSIAN: {
            const scale = 1.6;
            const twoScale2 = 2.0 * scale * scale;
            x *= 3.0 * scale;
            return (1.0 / Math.sqrt(Math.PI * twoScale2)) * Math.exp(-x * x / twoScale2);
        }
        default:
            return 0.0;
    }
}

function calcSeparableWeights(mode, radius) {
    // Kernel size is radius+1, but since it is symmetric we only store one half
    const size = Math.ceil(radius) + 1;
    const weights = new Float32Array(size);

    let sum = 0.0;

    // Center weight
    const centerWeight = separableKernelValue(mode, 0.0);
    weights[0] = centerWeight;
    sum += centerWeight;

    // Other weights in the positive direction
    // Add double to the sum to account for negative direction
    const scale = radius > 0.0 ? 1.0 / radius : 0.0;
    for (let i = 1; i < size; i++) {
        const weight = separableKernelValue(mode, i * scale);
        weights[i] = weight;
        sum += weight * 2.0;
    }

    // Normalize the weights
    for (let i = 0; i < size; i++) {
        weights[i] /= sum;
    }

    // Create 1D texture for kernel weights
    const kernelTexture = gpu_device.createTexture({
        size: [size],
        format: 'r32float',
        dimension: '1d',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
    });

    gpu_device.queue.writeTexture(
        { texture: kernelTexture },
        weights,
        { bytesPerRow: size * 4 },
        { width: size }
    );

    return { texture: kernelTexture, width: size };
}

function separablePass(commandEncoder, input, output, mode, horizontal, radius) {
    const width = cur_image_size.width;
    const height = cur_image_size.height;

    // Calculate kernel weights
    const kernel = calcSeparableWeights(mode, radius);

    // Create uniform buffer for blur params
    const paramsData = new ArrayBuffer(16); // vec2f (8) + i32 (4) + padding (4)
    const paramsView = new DataView(paramsData);
    paramsView.setFloat32(0, horizontal ? 1.0 / width : 0.0, true);
    paramsView.setFloat32(4, horizontal ? 0.0 : 1.0 / height, true);
    paramsView.setInt32(8, kernel.width, true);

    const paramsBuffer = gpu_device.createBuffer({
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    // Create bind group for this pass
    const blurBindGroup = gpu_device.createBindGroup({
        layout: pip_separable.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: kernel.texture.createView() },
            { binding: 3, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_separable);
    renderPass.setBindGroup(0, blurBindGroup);
    renderPass.draw(3);
    renderPass.end();

    // Resources (kernel texture, params buffer) will be garbage collected after GPU is done
}

function ensureBlurTextures(width, height) {
    // Create or recreate temp and output textures if size changed
    if (tex_blur_tmp && tex_blur_tmp.width === width && tex_blur_tmp.height === height) {
        return;
    }

    if (tex_blur_tmp) tex_blur_tmp.destroy();
    if (tex_blurred) tex_blurred.destroy();

    tex_blur_tmp = createTexture2D(width, height);
    tex_blurred = createTexture2D(width, height);
}

// ================ Dual Kawase blur

// Get a uniform buffer from pool (creates if needed)
function getKawaseUniformBuffer(size) {
    if (kawaseUniformBufferIndex >= kawaseUniformBuffers.length) {
        kawaseUniformBuffers.push(gpu_device.createBuffer({
            size: 32,  // Max size needed (Split Kawase params)
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        }));
    }
    return kawaseUniformBuffers[kawaseUniformBufferIndex++];
}

// Reset uniform buffer pool index at start of frame
function resetKawaseUniformBufferPool() {
    kawaseUniformBufferIndex = 0;
}

// Get a cached texture of given size (creates if not exists)
function getCachedTexture(width, height) {
    const key = `${width},${height}`;
    let textures = kawaseTextureCache.get(key);
    if (!textures) {
        textures = [];
        kawaseTextureCache.set(key, textures);
    }
    // Find an unused texture or create new one
    for (const entry of textures) {
        if (!entry.inUse) {
            entry.inUse = true;
            return entry.texture;
        }
    }
    // Create new texture
    const texture = createTexture2D(width, height);
    textures.push({ texture, inUse: true });
    return texture;
}

// Mark all cached textures as unused (call at start of frame)
function resetTextureCache() {
    for (const textures of kawaseTextureCache.values()) {
        for (const entry of textures) {
            entry.inUse = false;
        }
    }
}

// Clear texture cache (call when image size changes)
function clearTextureCache() {
    for (const textures of kawaseTextureCache.values()) {
        for (const entry of textures) {
            entry.texture.destroy();
        }
    }
    kawaseTextureCache.clear();
}

function kawaseDownsample(commandEncoder, input, fullSizeX, fullSizeY, divisor, ratio) {
    const sizeX = Math.max(Math.floor(fullSizeX / divisor), 1);
    const sizeY = Math.max(Math.floor(fullSizeY / divisor), 1);
    const output = getCachedTexture(sizeX, sizeY);

    // Note: "step" is based on *output* size, which is 2x smaller than input
    const stepX = ratio / sizeX;
    const stepY = ratio / sizeY;

    const paramsData = new Float32Array([stepX, stepY]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_dk_down.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_dk_down);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function kawaseUpsample(commandEncoder, input, fullSizeX, fullSizeY, divisor, ratio, existingOutput = null) {
    const sizeX = Math.max(Math.floor(fullSizeX / divisor), 1);
    const sizeY = Math.max(Math.floor(fullSizeY / divisor), 1);
    const output = existingOutput || getCachedTexture(sizeX, sizeY);

    // Note: "step" is based on *input* size, which is 2x smaller than output
    const stepX = ratio / input.width;
    const stepY = ratio / input.height;

    const paramsData = new Float32Array([stepX, stepY]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_dk_up.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_dk_up);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function kawaseMix(commandEncoder, input, output, ratio) {
    const paramsData = new Float32Array([ratio]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_dk_mix.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_point },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'load',  // Important: load existing content for blending
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(pip_dk_mix);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();
}

function kawaseCopy(commandEncoder, input, output) {
    commandEncoder.copyTextureToTexture(
        { texture: input },
        { texture: output },
        [input.width, input.height]
    );
}

function blurDualKawase(commandEncoder, input, output) {
    // Dual Kawase is isotropic, so blur based on max(x,y)
    const radius = Math.max(blur_params.radius_x, blur_params.radius_y);

    // Amount of Kawase "steps" to do; this more or less matches the blur amount of Gaussian
    const numSteps = radius / 3.0;
    if (numSteps <= 0.0) {
        kawaseCopy(commandEncoder, input, output);
        return;
    }

    const fullSizeX = cur_image_size.width;
    const fullSizeY = cur_image_size.height;

    let curr = input;

    // Downsample
    let lastPass = 0;
    for (let i = 2; i <= numSteps; i *= 2) {
        curr = kawaseDownsample(commandEncoder, curr, fullSizeX, fullSizeY, i, 1.0);
        lastPass = i;
    }

    let residual = numSteps - lastPass;
    if (residual > 0.0) {
        let nextPass = Math.max(lastPass, 1) * 2;
        let ratio = residual / (nextPass - lastPass);
        lastPass = Math.max(lastPass, 1);

        // Downsample and upsample one more step
        const extraDown = kawaseDownsample(commandEncoder, curr, fullSizeX, fullSizeY, nextPass, 0.5 + 0.5 * ratio);
        const extraUp = kawaseUpsample(commandEncoder, extraDown, fullSizeX, fullSizeY, lastPass, 0.5 + 0.5 * ratio);

        // Mix current with that extra step based on ratio
        kawaseMix(commandEncoder, curr, extraUp, 1.0 - ratio);
        curr = extraUp;

        // If there will be no further upsamples, copy to output
        if (lastPass < 2) {
            kawaseCopy(commandEncoder, curr, output);
            return;
        }
    }

    // Upsample
    for (let i = Math.floor(lastPass / 2); i >= 1; i = Math.floor(i / 2)) {
        const isLast = i === 1;
        curr = kawaseUpsample(commandEncoder, curr, fullSizeX, fullSizeY, i, 1.0, isLast ? output : null);
    }
}

// ================ Split Kawase blur

function splitKawaseStep(commandEncoder, cfg, input, fullSizeX, fullSizeY, divisor, horizontal) {
    const sizeX = horizontal ? Math.max(Math.floor(fullSizeX / divisor), 1) : fullSizeX;
    const sizeY = horizontal ? fullSizeY : Math.max(Math.floor(fullSizeY / divisor), 1);
    const output = getCachedTexture(sizeX, sizeY);

    // X or Y component is set to zero based on whether we are doing horizontal or vertical pass
    const stepX = horizontal ? 1.0 / input.width : 0.0;
    const stepY = horizontal ? 0.0 : 1.0 / input.height;

    // Params: uvStep (vec2f = 8 bytes) + w00, w05, w10, w15, w20 (5 * f32 = 20 bytes) = 28 bytes, padded to 32
    const paramsData = new Float32Array([stepX, stepY, cfg.w00, cfg.w05, cfg.w10, cfg.w15, cfg.w20, 0.0]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_split_kaw.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_split_kaw);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function splitKawaseAxis(commandEncoder, cfgDown, cfgUp, input, output, radius, horizontal) {
    // Amount of Kawase "steps" to do; this more or less matches the blur amount of Gaussian
    const numSteps = radius / 3.0;

    const fullSizeX = cur_image_size.width;
    const fullSizeY = cur_image_size.height;

    let curr = input;

    // Downsample
    let lastPass = 0;
    for (let i = 2; i <= numSteps; i *= 2) {
        curr = splitKawaseStep(commandEncoder, cfgDown, curr, fullSizeX, fullSizeY, i, horizontal);
        lastPass = i;
    }

    let residual = numSteps - lastPass;
    if (residual > 0.0) {
        let nextPass = Math.max(lastPass, 1) * 2;
        let ratio = residual / (nextPass - lastPass);
        lastPass = Math.max(lastPass, 1);

        // Downsample and upsample one more step
        const extraDown = splitKawaseStep(commandEncoder, cfgDown, curr, fullSizeX, fullSizeY, nextPass, horizontal);
        const extraUp = splitKawaseStep(commandEncoder, cfgUp, extraDown, fullSizeX, fullSizeY, lastPass, horizontal);

        // Mix current with that extra step based on ratio
        kawaseMix(commandEncoder, curr, extraUp, 1.0 - ratio);
        curr = extraUp;
    }

    // Upsample
    for (let i = Math.floor(lastPass / 2); i >= 1; i = Math.floor(i / 2)) {
        curr = splitKawaseStep(commandEncoder, cfgUp, curr, fullSizeX, fullSizeY, i, horizontal);
    }

    // Copy to output
    kawaseCopy(commandEncoder, curr, output);
}

function blurSplitKawase(commandEncoder, input, output) {
    // Get temp texture for intermediate result between X and Y passes
    const tmp = getCachedTexture(cur_image_size.width, cur_image_size.height);

    // Horizontal pass: input -> tmp
    splitKawaseAxis(commandEncoder, blur_params.split_cfg_down, blur_params.split_cfg_up,
        input, tmp, blur_params.radius_x, true);

    // Vertical pass: tmp -> output
    splitKawaseAxis(commandEncoder, blur_params.split_cfg_down, blur_params.split_cfg_up,
        tmp, output, blur_params.radius_y, false);
}

// ================ Rendering

async function render() {
    if (!gpu_device || !tex_source) return;

    const { width, height } = cur_image_size;
    if (width === 0 || height === 0) return;

    // Ensure blur textures exist
    ensureBlurTextures(width, height);

    // Reset resource pools for this frame
    resetKawaseUniformBufferPool();
    resetTextureCache();

    const commandEncoder = gpu_device.createCommandEncoder();

    // Determine which texture to display
    let textureToDisplay = tex_source;

    // Apply blur if radius > 0
    if (blur_params.radius_x > 0 || blur_params.radius_y > 0) {
        if (blur_params.mode === BlurMode.DUAL_KAWASE) {
            // Dual Kawase blur
            blurDualKawase(commandEncoder, tex_source, tex_blurred);
            textureToDisplay = tex_blurred;
        } else if (blur_params.mode === BlurMode.SPLIT_KAWASE) {
            // Split Kawase blur
            blurSplitKawase(commandEncoder, tex_source, tex_blurred);
            textureToDisplay = tex_blurred;
        } else {
            // Separable blur (Box, Tent, Gaussian)
            // Horizontal pass: input -> temp
            if (blur_params.radius_x > 0) {
                separablePass(commandEncoder, tex_source, tex_blur_tmp, blur_params.mode, true, blur_params.radius_x);
            }

            // Vertical pass: temp -> output (or input -> output if no horizontal)
            if (blur_params.radius_y > 0) {
                const vertInput = blur_params.radius_x > 0 ? tex_blur_tmp : tex_source;
                separablePass(commandEncoder, vertInput, tex_blurred, blur_params.mode, false, blur_params.radius_y);
                textureToDisplay = tex_blurred;
            } else {
                textureToDisplay = tex_blur_tmp;
            }
        }
    }

    // Create bind group for final display
    const displayBindGroup = gpu_device.createBindGroup({
        layout: pip_display.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: textureToDisplay.createView() },
        ],
    });

    // Final pass: render to screen with sRGB conversion
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: gpu_ctx.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(pip_display);
    renderPass.setBindGroup(0, displayBindGroup);
    renderPass.draw(3);
    renderPass.end();

    gpu_device.queue.submit([commandEncoder.finish()]);
}

// ================ Event handlers

function setupEventHandlers() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    // Click to browse
    dropzone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageFile(e.target.files[0]);
        }
    });

    // Window resize
    window.addEventListener('resize', () => {
        if (cur_image_size.width > 0) {
            fitCanvasToViewport(cur_image_size.width, cur_image_size.height);
        }
    });

    // Drag and drop
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            if (file.type === 'image/png' || file.type === 'image/jpeg') {
                handleImageFile(file);
            } else {
                document.getElementById('error').textContent = 'Please drop a PNG or JPEG file.';
            }
        }
    });

    // Blur mode radio buttons
    const splitKawaseControls = document.getElementById('splitKawaseControls');
    document.querySelectorAll('input[name="blurMode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            blur_params.mode = e.target.value;
            // Enable/disable Split Kawase weight controls
            splitKawaseControls.classList.toggle('enabled', e.target.value === 'split_kawase');
            onBlurParamsChanged();
        });
    });

    // Radius X slider
    const radiusX = document.getElementById('radiusX');
    const radiusXValue = document.getElementById('radiusXValue');
    const radiusY = document.getElementById('radiusY');
    const radiusYValue = document.getElementById('radiusYValue');
    const radiusYRow = document.getElementById('radiusYRow');
    const lockRadius = document.getElementById('lockRadius');

    radiusX.addEventListener('input', (e) => {
        let value = parseInt(e.target.value);
        if (blur_params.lock_pow2) {
            value = snapToPow2Radius(value);
            radiusX.value = value;
        }
        blur_params.radius_x = value;
        radiusXValue.textContent = value;

        if (blur_params.lock_radius) {
            blur_params.radius_y = value;
            radiusY.value = value;
            radiusYValue.textContent = value;
        }
        onBlurParamsChanged();
    });

    // Radius Y slider
    radiusY.addEventListener('input', (e) => {
        let value = parseInt(e.target.value);
        if (blur_params.lock_pow2) {
            value = snapToPow2Radius(value);
            radiusY.value = value;
        }
        blur_params.radius_y = value;
        radiusYValue.textContent = value;
        onBlurParamsChanged();
    });

    // Lock checkbox
    lockRadius.addEventListener('change', (e) => {
        blur_params.lock_radius = e.target.checked;
        radiusY.disabled = e.target.checked;
        radiusYRow.classList.toggle('disabled', e.target.checked);

        if (e.target.checked) {
            // Sync Y to X when locking
            blur_params.radius_y = blur_params.radius_x;
            radiusY.value = blur_params.radius_x;
            radiusYValue.textContent = blur_params.radius_x;
            onBlurParamsChanged();
        }
    });

    // Lock pow2
    const lockPow2 = document.getElementById('lockPow2');
    lockPow2.addEventListener('change', (e) => {
        blur_params.lock_pow2 = e.target.checked;
        if (e.target.checked) {
            // Snap current values to nearest pow2 radius
            blur_params.radius_x = snapToPow2Radius(blur_params.radius_x);
            radiusX.value = blur_params.radius_x;
            radiusXValue.textContent = blur_params.radius_x;

            blur_params.radius_y = snapToPow2Radius(blur_params.radius_y);
            radiusY.value = blur_params.radius_y;
            radiusYValue.textContent = blur_params.radius_y;

            onBlurParamsChanged();
        }
    });

    // Split Kawase weight sliders
    const defaultWeights = {
        down: { w00: 2.12, w05: 0.75, w10: 1.30, w15: 0.10, w20: 0.15 },
        up:   { w00: 0.00, w05: 2.80, w10: 0.70, w15: 0.00, w20: 0.01 },
    };

    function setupWeightSlider(prefix, configKey, weightKey) {
        const slider = document.getElementById(`${prefix}${weightKey.toUpperCase()}`);
        const valueEl = document.getElementById(`${prefix}${weightKey.toUpperCase()}Value`);
        slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            blur_params[configKey][weightKey] = value;
            valueEl.textContent = value.toFixed(2);
            onBlurParamsChanged();
        });
    }

    // Downsample weights
    setupWeightSlider('down', 'splitCfgDown', 'w00');
    setupWeightSlider('down', 'splitCfgDown', 'w05');
    setupWeightSlider('down', 'splitCfgDown', 'w10');
    setupWeightSlider('down', 'splitCfgDown', 'w15');
    setupWeightSlider('down', 'splitCfgDown', 'w20');

    // Upsample weights
    setupWeightSlider('up', 'splitCfgUp', 'w00');
    setupWeightSlider('up', 'splitCfgUp', 'w05');
    setupWeightSlider('up', 'splitCfgUp', 'w10');
    setupWeightSlider('up', 'splitCfgUp', 'w15');
    setupWeightSlider('up', 'splitCfgUp', 'w20');

    // Reset weights button
    document.getElementById('resetWeights').addEventListener('click', () => {
        // Reset to defaults
        blur_params.split_cfg_down = { ...defaultWeights.down };
        blur_params.split_cfg_up = { ...defaultWeights.up };

        // Update sliders and values
        ['w00', 'w05', 'w10', 'w15', 'w20'].forEach(key => {
            const downSlider = document.getElementById(`down${key.toUpperCase()}`);
            const downValue = document.getElementById(`down${key.toUpperCase()}Value`);
            downSlider.value = defaultWeights.down[key];
            downValue.textContent = defaultWeights.down[key].toFixed(2);

            const upSlider = document.getElementById(`up${key.toUpperCase()}`);
            const upValue = document.getElementById(`up${key.toUpperCase()}Value`);
            upSlider.value = defaultWeights.up[key];
            upValue.textContent = defaultWeights.up[key].toFixed(2);
        });

        onBlurParamsChanged();
    });
}

function onBlurParamsChanged() {
    render();
}

async function main() {
    setupEventHandlers();
    await initWebGPU();
}
main();
</script>
</body>
</html>
