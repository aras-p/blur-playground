<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Playground</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .dropzone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 20px 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: #888;
            background-color: #252525;
        }
        .dropzone input {
            display: none;
        }
        #canvas {
            border: 1px solid #333;
            max-width: 100%;
            background: #000;
        }
        #status {
            margin-top: 10px;
            color: #888;
        }
        #error {
            color: #ff6b6b;
            margin-top: 10px;
        }
        .control-group {
            background: #252525;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-group label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-transform: none;
            color: #e0e0e0;
            font-size: 14px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-row label {
            min-width: 60px;
            text-transform: none;
            color: #e0e0e0;
            font-size: 14px;
        }
        .slider-row input[type="range"] {
            flex: 1;
            min-width: 150px;
        }
        .slider-row .value {
            min-width: 40px;
            text-align: right;
            font-family: monospace;
        }
        .slider-row.disabled label,
        .slider-row.disabled .value {
            color: #555;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-row label {
            text-transform: none;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept="image/png,image/jpeg">
            <span>Click to browse or drag & drop PNG/JPG</span>
        </div>

        <div class="control-group">
            <label>Blur Mode</label>
            <div class="radio-group">
                <label><input type="radio" name="blurMode" value="box" checked> Box</label>
                <label><input type="radio" name="blurMode" value="tent"> Tent</label>
                <label><input type="radio" name="blurMode" value="gaussian"> Gaussian</label>
            </div>
        </div>

        <div class="control-group">
            <label>Blur Radius</label>
            <div class="slider-row">
                <label for="radiusX">X:</label>
                <input type="range" id="radiusX" min="0" max="500" value="10">
                <span class="value" id="radiusXValue">10</span>
            </div>
            <div class="slider-row disabled" id="radiusYRow">
                <label for="radiusY">Y:</label>
                <input type="range" id="radiusY" min="0" max="500" value="10" disabled>
                <span class="value" id="radiusYValue">10</span>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="lockRadius" checked>
                <label for="lockRadius">Lock X & Y</label>
            </div>
        </div>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="status">WebGPU initializing...</div>
    <div id="error"></div>

<script>
// ============================================================================
// WGSL Shaders
// ============================================================================

const PASSTHROUGH_SHADER = `
struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f,
}

@vertex
fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
    // Full-screen triangle
    var pos = array<vec2f, 3>(
        vec2f(-1.0, -1.0),
        vec2f( 3.0, -1.0),
        vec2f(-1.0,  3.0)
    );
    var uv = array<vec2f, 3>(
        vec2f(0.0, 1.0),
        vec2f(2.0, 1.0),
        vec2f(0.0, -1.0)
    );

    var output: VertexOutput;
    output.position = vec4f(pos[vertexIndex], 0.0, 1.0);
    output.uv = uv[vertexIndex];
    return output;
}

@group(0) @binding(0) var texSampler: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;

// Linear to sRGB conversion
fn linearToSrgb(linear: vec3f) -> vec3f {
    let cutoff = linear < vec3f(0.0031308);
    let higher = vec3f(1.055) * pow(linear, vec3f(1.0/2.4)) - vec3f(0.055);
    let lower = linear * vec3f(12.92);
    return select(higher, lower, cutoff);
}

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let color = textureSample(tex, texSampler, in.uv);
    // Convert from linear back to sRGB for display
    return vec4f(linearToSrgb(color.rgb), color.a);
}
`;

// ============================================================================
// WebGPU State
// ============================================================================

let device = null;
let context = null;
let canvasFormat = null;
let passthroughPipeline = null;
let sampler = null;
let imageTexture = null;
let bindGroup = null;
let currentImageSize = { width: 0, height: 0 };

// ============================================================================
// Blur Parameters
// ============================================================================

const BlurMode = {
    BOX: 'box',
    TENT: 'tent',
    GAUSSIAN: 'gaussian',
};

const blurParams = {
    mode: BlurMode.BOX,
    radiusX: 10,
    radiusY: 10,
    lockRadius: true,
};

// ============================================================================
// Initialization
// ============================================================================

async function initWebGPU() {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    if (!navigator.gpu) {
        errorEl.textContent = 'WebGPU is not supported in this browser.';
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            errorEl.textContent = 'Failed to get WebGPU adapter.';
            return false;
        }

        device = await adapter.requestDevice({
            requiredFeatures: ['float32-filterable', 'float32-blendable'],
        });
        context = canvas.getContext('webgpu');
        canvasFormat = navigator.gpu.getPreferredCanvasFormat();

        context.configure({
            device: device,
            format: canvasFormat,
            alphaMode: 'premultiplied',
        });

        // Create sampler
        sampler = device.createSampler({
            magFilter: 'linear',
            minFilter: 'linear',
            addressModeU: 'clamp-to-edge',
            addressModeV: 'clamp-to-edge',
        });

        // Create passthrough pipeline
        const shaderModule = device.createShaderModule({
            code: PASSTHROUGH_SHADER,
        });

        passthroughPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: shaderModule,
                entryPoint: 'vs_main',
            },
            fragment: {
                module: shaderModule,
                entryPoint: 'fs_main',
                targets: [{ format: canvasFormat }],
            },
            primitive: {
                topology: 'triangle-list',
            },
        });

        statusEl.textContent = 'WebGPU ready. Load an image to begin.';
        return true;
    } catch (e) {
        errorEl.textContent = `WebGPU initialization failed: ${e.message}`;
        return false;
    }
}

// ============================================================================
// Image Loading
// ============================================================================

// sRGB to linear conversion
function srgbToLinear(value) {
    const v = value / 255.0;
    if (v <= 0.04045) {
        return v / 12.92;
    }
    return Math.pow((v + 0.055) / 1.055, 2.4);
}

async function loadImage(file) {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(img.src);
            reject(new Error('Failed to load image'));
        };
        img.src = URL.createObjectURL(file);
    });
}

function imageToLinearFloat(img) {
    // Draw image to temp canvas to get pixel data
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const ctx = tempCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, img.width, img.height);
    const pixels = imageData.data;

    // Convert to linear float RGBA
    const floatData = new Float32Array(img.width * img.height * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        const idx = i;
        floatData[idx + 0] = srgbToLinear(pixels[i + 0]);
        floatData[idx + 1] = srgbToLinear(pixels[i + 1]);
        floatData[idx + 2] = srgbToLinear(pixels[i + 2]);
        floatData[idx + 3] = pixels[i + 3] / 255.0;
    }

    return { data: floatData, width: img.width, height: img.height };
}

function createTextureFromLinearData(linearData) {
    const { data, width, height } = linearData;

    // Destroy old texture if exists
    if (imageTexture) {
        imageTexture.destroy();
    }

    imageTexture = device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
    });

    device.queue.writeTexture(
        { texture: imageTexture },
        data,
        { bytesPerRow: width * 4 * 4 },
        { width, height }
    );

    // Create bind group
    bindGroup = device.createBindGroup({
        layout: passthroughPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: imageTexture.createView() },
        ],
    });

    return { width, height };
}

async function handleImageFile(file) {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    try {
        statusEl.textContent = 'Loading image...';

        const img = await loadImage(file);
        statusEl.textContent = `Converting to linear (${img.width}x${img.height})...`;

        const linearData = imageToLinearFloat(img);
        statusEl.textContent = 'Uploading to GPU...';

        const { width, height } = createTextureFromLinearData(linearData);

        // Resize canvas to match image (internal resolution)
        canvas.width = width;
        canvas.height = height;
        context.configure({
            device: device,
            format: canvasFormat,
            alphaMode: 'premultiplied',
        });

        // Store size and constrain display to fit viewport
        currentImageSize = { width, height };
        fitCanvasToViewport(width, height);

        // Render
        render();

        statusEl.textContent = `Loaded: ${file.name} (${width}x${height})`;
    } catch (e) {
        errorEl.textContent = `Error: ${e.message}`;
        statusEl.textContent = 'Failed to load image.';
    }
}

// ============================================================================
// Canvas Sizing
// ============================================================================

function fitCanvasToViewport(imageWidth, imageHeight) {
    const canvas = document.getElementById('canvas');
    const margin = 40; // pixels of margin around canvas

    // Available space (viewport minus controls and margins)
    const controlsHeight = document.querySelector('.controls').offsetHeight;
    const maxWidth = window.innerWidth - margin * 2;
    const maxHeight = window.innerHeight - controlsHeight - margin * 3;

    // Calculate scale to fit
    const scaleX = maxWidth / imageWidth;
    const scaleY = maxHeight / imageHeight;
    const scale = Math.min(scaleX, scaleY, 1.0); // Never upscale

    canvas.style.width = Math.floor(imageWidth * scale) + 'px';
    canvas.style.height = Math.floor(imageHeight * scale) + 'px';
}

// ============================================================================
// Rendering
// ============================================================================

function render() {
    if (!device || !bindGroup) return;

    const commandEncoder = device.createCommandEncoder();

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(passthroughPipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    device.queue.submit([commandEncoder.finish()]);
}

// ============================================================================
// Event Handlers
// ============================================================================

function setupEventHandlers() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    // Click to browse
    dropzone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageFile(e.target.files[0]);
        }
    });

    // Window resize
    window.addEventListener('resize', () => {
        if (currentImageSize.width > 0) {
            fitCanvasToViewport(currentImageSize.width, currentImageSize.height);
        }
    });

    // Drag and drop
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            if (file.type === 'image/png' || file.type === 'image/jpeg') {
                handleImageFile(file);
            } else {
                document.getElementById('error').textContent = 'Please drop a PNG or JPEG file.';
            }
        }
    });

    // Blur mode radio buttons
    document.querySelectorAll('input[name="blurMode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            blurParams.mode = e.target.value;
            onBlurParamsChanged();
        });
    });

    // Radius X slider
    const radiusX = document.getElementById('radiusX');
    const radiusXValue = document.getElementById('radiusXValue');
    const radiusY = document.getElementById('radiusY');
    const radiusYValue = document.getElementById('radiusYValue');
    const radiusYRow = document.getElementById('radiusYRow');
    const lockRadius = document.getElementById('lockRadius');

    radiusX.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        blurParams.radiusX = value;
        radiusXValue.textContent = value;

        if (blurParams.lockRadius) {
            blurParams.radiusY = value;
            radiusY.value = value;
            radiusYValue.textContent = value;
        }
        onBlurParamsChanged();
    });

    // Radius Y slider
    radiusY.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        blurParams.radiusY = value;
        radiusYValue.textContent = value;
        onBlurParamsChanged();
    });

    // Lock checkbox
    lockRadius.addEventListener('change', (e) => {
        blurParams.lockRadius = e.target.checked;
        radiusY.disabled = e.target.checked;
        radiusYRow.classList.toggle('disabled', e.target.checked);

        if (e.target.checked) {
            // Sync Y to X when locking
            blurParams.radiusY = blurParams.radiusX;
            radiusY.value = blurParams.radiusX;
            radiusYValue.textContent = blurParams.radiusX;
            onBlurParamsChanged();
        }
    });
}

function onBlurParamsChanged() {
    // TODO: trigger blur recalculation when shaders are implemented
    console.log('Blur params changed:', blurParams);
}

// ============================================================================
// Main
// ============================================================================

async function main() {
    setupEventHandlers();
    await initWebGPU();
}

main();
</script>
</body>
</html>
