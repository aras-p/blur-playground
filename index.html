<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Playground</title>
<style>
* {
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 10px;
    background: #1a1a1a;
    color: #e0e0e0;
}
.controls {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: flex-start;
}
.dropzone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 10px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
    max-width: 140px;
    line-height: 1.4;
}
.dropzone:hover, .dropzone.dragover {
    border-color: #888;
    background-color: #252525;
}
.dropzone input {
    display: none;
}
.sample-files {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
}
.sample-link {
    font-size: 11px;
    color: #888;
    text-decoration: none;
}
.sample-link:hover {
    color: #aaa;
    text-decoration: underline;
}
.main-container {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}
#canvas {
    border: 1px solid #333;
    max-width: 100%;
    background: #000;
}
.texture-list-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 180px;
}
.texture-list-container label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}
#textureList {
    background: #252525;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 12px;
    font-family: monospace;
    min-height: 300px;
    max-height: 600px;
    overflow-y: auto;
}
#textureList option {
    padding: 4px 8px;
}
#textureList option:checked {
    background: #444;
}
#textureList option.final-output {
    font-weight: bold;
}
#renderVideo, #benchmark {
    margin-top: 5px;
    padding: 6px 10px;
    background: #383838;
    border: 1px solid #555;
    border-radius: 4px;
    color: #e0e0e0;
    cursor: pointer;
}
#renderVideo:disabled, #benchmark:disabled { opacity: 0.5; cursor: default; }
#videoStatus, #benchmarkStatus { max-width: 290px; font-size: 12px; color: #bbb; }
#videoStatus a, #benchmarkStatus a { color: #acd1ff; }
.benchmark-controls { width: 290px; }
#benchmarkStatus { min-height: 32px; }
#benchmarkResult { max-width: 1100px; margin: 20px 0; }
#benchmarkResult svg { display: block; width: 100%; height: auto; }
#benchmarkResult a { display: inline-block; margin-top: 8px; color: #acd1ff; }
#status {
    margin-top: 10px;
    color: #888;
}
#error {
    color: #ff6b6b;
    margin-top: 10px;
}
.control-group {
    background: #252525;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.control-group label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.radio-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
}
.slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.slider-row label {
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
}
.slider-row input[type="range"] {
    flex: 1;
    min-width: 150px;
}
.slider-row .value {
    min-width: 2.5em;
    text-align: right;
    font-family: monospace;
}
.slider-row.disabled label,
.slider-row.disabled .value {
    color: #555;
}
.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.checkbox-row label {
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
    cursor: pointer;
}
.checkbox-row input:disabled + label {
    color: #555;
    cursor: default;
}
</style>
</head>
<body>
<div class="controls">
    <div class="control-group">
        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept="image/png,image/jpeg,.exr">
            <span>Click to browse or drag & drop PNG/JPG/EXR</span>
        </div>
        <div class="sample-files">
            <a href="#" class="sample-link" data-src="exr/test_a_small.exr">test_a_small</a>
            <a href="#" class="sample-link" data-src="exr/test_b_1080p.exr">test_b_1080p</a>
        </div>
    </div>

    <div class="control-group">
        <label>Blur Mode</label>
        <div class="radio-group">
            <label><input type="radio" name="blurMode" value="box"> Box</label>
            <label><input type="radio" name="blurMode" value="tent"> Tent</label>
            <label><input type="radio" name="blurMode" value="gaussian"> Gaussian</label>
            <label><input type="radio" name="blurMode" value="fast_gaussian"> Fast Gaussian</label>
            <label><input type="radio" name="blurMode" value="smol_gaussian" checked> Smol Gaussian</label>
            <label><input type="radio" name="blurMode" value="skia_gaussian"> Skia Gaussian</label>
            <label><input type="radio" name="blurMode" value="dual_kawase"> Dual Kawase</label>
            <label><input type="radio" name="blurMode" value="ryg"> Ryg Blur</label>
        </div>
    </div>

    <div class="control-group">
        <label>Blur Options</label>
        <div class="checkbox-row">
            <input type="checkbox" id="disableSmol4xReduction">
            <label for="disableSmol4xReduction">No 4x reduction (smol)</label>
        </div>
        <label for="rygBoxCount">Iteratons (ryg)</label>
        <div class="slider-row">
            <input type="range" id="rygBoxCount" min="1" max="5" step="1" value="3" disabled>
            <span class="value" id="rygBoxCountValue">3</span>
        </div>
    </div>

    <div class="control-group">
        <label>Blur Radius</label>
        <div class="slider-row">
            <label for="radiusX">X:</label>
            <input type="range" id="radiusX" min="0" max="1000" step="1" value="96">
            <span class="value" id="radiusXValue">96</span>
        </div>
        <div class="slider-row" id="radiusYRow">
            <label for="radiusY">Y:</label>
            <input type="range" id="radiusY" min="0" max="1000" step="1" value="96">
            <span class="value" id="radiusYValue">96</span>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="lockRadius">
            <label for="lockRadius">Lock X & Y</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="animateRadius">
            <label for="animateRadius">Animate</label>
        </div>
        <button type="button" id="renderVideo">Render Video</button>
        <div id="videoStatus" role="status" aria-live="polite"></div>
    </div>
    <div class="control-group benchmark-controls">
        <button type="button" id="benchmark">Benchmark</button>
        <div class="checkbox-row"><input type="checkbox" name="benchmarkMode" id="benchmark-gaussian" value="gaussian" checked><label for="benchmark-gaussian">Gaussian</label></div>
        <div class="checkbox-row"><input type="checkbox" name="benchmarkMode" id="benchmark-fast_gaussian" value="fast_gaussian" checked><label for="benchmark-fast_gaussian">Fast Gaussian</label></div>
        <div class="checkbox-row"><input type="checkbox" name="benchmarkMode" id="benchmark-smol_gaussian" value="smol_gaussian" checked><label for="benchmark-smol_gaussian">Smol Gaussian</label></div>
        <div class="checkbox-row"><input type="checkbox" name="benchmarkMode" id="benchmark-skia_gaussian" value="skia_gaussian" checked><label for="benchmark-skia_gaussian">Skia Gaussian</label></div>
        <div class="checkbox-row"><input type="checkbox" name="benchmarkMode" id="benchmark-dual_kawase" value="dual_kawase" checked><label for="benchmark-dual_kawase">Dual Kawase</label></div>
        <div class="checkbox-row"><input type="checkbox" name="benchmarkMode" id="benchmark-ryg" value="ryg" checked><label for="benchmark-ryg">Ryg Blur</label></div>
        <div id="benchmarkStatus" role="status" aria-live="polite"></div>
    </div>

</div>
<div class="main-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="texture-list-container">
        <label>Display Texture</label>
        <select id="textureList" size="8">
            <option value="-1" selected class="final-output">Blurred Output</option>
        </select>
    </div>
</div>
<div id="benchmarkResult" hidden></div>
<div id="status">WebGPU initializing...</div>
<div id="error"></div>

<script src="js/fflate.js"></script>
<script src="js/exrloader.js"></script>
<script src="js/gpu-helpers.js"></script>
<script src="js/separable-blur.js"></script>
<script src="js/smol-gaussian.js"></script>
<script src="js/dual-kawase.js"></script>
<script src="js/fast-gaussian.js"></script>
<script src="js/skia-gaussian.js"></script>
<script src="js/ryg-blur.js"></script>
<script src="js/video-export.js"></script>
<script src="js/benchmark.js"></script>
<script>
// ================ Shaders
const DISPLAY_SHADER = FULLSCREEN_VERTEX_SHADER + `
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
fn linearToSrgb(x: vec3f) -> vec3f {
    return select(
        vec3f(1.055) * pow(x, vec3f(1.0/2.4)) - vec3f(0.055),
        x * vec3f(12.92),
        x < vec3f(0.0031308));
}
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let color = textureSample(tex, smp, in.uv);
    return vec4f(linearToSrgb(color.rgb), color.a);
}
`;

// ================ WebGPU state

/** @type {GPUDevice} */
let gpu_device = null;
/** @type {GPUCanvasContext} */
let gpu_ctx = null;
/** @type {GPUTextureFormat} */
let gpu_canvas_format = null;
/** @type {GPUSampler} */
let gpu_sampler_linear = null;
/** @type {GPUSampler} */
let gpu_sampler_point = null;
/** @type {GPUTexture} */
let tex_source = null;
/** @type {GPUTexture} */
let tex_blurred = null;
/** @type {GPURenderPipeline} */
let pip_display = null;
/** @type {SkiaGaussian} */
let skiaGaussian = null;
let cur_image_size = { width: 0, height: 0 };

// Intermediate texture tracking for visualization
// Array of { texture, name } where name is a debug string
let intermediateTextures = [];
let selectedTextureIndex = -1; // -1 means "Blurred Output"

// ================ Various helpers

function fitCanvasToViewport(imageWidth, imageHeight) {
    const canvas = document.getElementById('canvas');
    const margin = 20; // pixels of margin around canvas

    // Available space (viewport minus controls and margins)
    const controlsHeight = document.querySelector('.controls').offsetHeight;
    const sidebarWidth = document.querySelector('.texture-list-container').offsetWidth;
    const maxWidth = Math.max(1, window.innerWidth - sidebarWidth - margin * 2 - 10);
    const maxHeight = Math.max(1, window.innerHeight - controlsHeight - margin * 3);

    // Calculate scale to fit
    const scaleX = maxWidth / imageWidth;
    const scaleY = maxHeight / imageHeight;
    const scale = Math.min(scaleX, scaleY, 4.0); // don't scale up by more than 4x

    canvas.style.width = Math.floor(imageWidth * scale) + 'px';
    canvas.style.height = Math.floor(imageHeight * scale) + 'px';
}

// ================ Blur parameters

const BlurMode = {
    BOX: 'box',
    TENT: 'tent',
    GAUSSIAN: 'gaussian',
    FAST_GAUSSIAN: 'fast_gaussian',
    SMOL_GAUSSIAN: 'smol_gaussian',
    SKIA_GAUSSIAN: 'skia_gaussian',
    DUAL_KAWASE: 'dual_kawase',
    RYG: 'ryg',
};

const blur_params = {
    mode: BlurMode.SMOL_GAUSSIAN,
    disable_smol_4x_reduction: false,
    ryg_box_count: 3,
    radius_x: 96,
    radius_y: 96,
    lock_radius: false,
};

// ================ Initialization

let gpuDeviceLost = false;

async function initWebGPU() {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    if (!navigator.gpu) {
        errorEl.textContent = 'WebGPU is not supported in this browser.';
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            errorEl.textContent = 'Failed to get WebGPU adapter.';
            return false;
        }

        const requiredFeatures = ['float32-filterable', 'float32-blendable'];
        gpu_device = await adapter.requestDevice({ requiredFeatures });
        gpu_device.lost.then(info => {
            gpuDeviceLost = true;
            document.getElementById('animateRadius').checked = false;
            errorEl.textContent = `GPU device lost (${info.reason}): ${info.message || 'The GPU stopped responding.'} Reload the page to recover.`;
            statusEl.textContent = 'GPU unavailable. Reload required.';
            document.getElementById('renderVideo').disabled = true;
            document.getElementById('benchmark').disabled = true;
        });
        gpu_ctx = canvas.getContext('webgpu');
        gpu_canvas_format = navigator.gpu.getPreferredCanvasFormat();

        gpu_ctx.configure({
            device: gpu_device,
            format: gpu_canvas_format,
            alphaMode: 'premultiplied',
        });

        gpu_sampler_linear = createSampler('linear');
        gpu_sampler_point = createSampler('nearest');

        pip_display = createPipeline(DISPLAY_SHADER, gpu_canvas_format);
        initSeparableBlur();
        initDualKawase();
        skiaGaussian = new SkiaGaussian(gpu_device, FULLSCREEN_VERTEX_SHADER);
        initSmolGaussian();
        initRygBlur();

        statusEl.textContent = 'WebGPU ready. Load an image to begin.';
        return true;
    } catch (e) {
        errorEl.textContent = `WebGPU initialization failed: ${e.message}`;
        return false;
    }
}

// ================ Image loading

// sRGB to linear conversion
function srgbToLinear(value) {
    const v = value / 255.0;
    if (v <= 0.04045) {
        return v / 12.92;
    }
    return Math.pow((v + 0.055) / 1.055, 2.4);
}

async function loadImage(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(img.src);
            reject(new Error('Failed to load image'));
        };
        img.src = URL.createObjectURL(file);
    });
}

// Byte inputs have only 256 possible values; avoid three powers per pixel.
const srgbToLinearTable = Float32Array.from({ length: 256 }, (_, i) => srgbToLinear(i));

function imageToLinearFloat(img) {
    // Draw image to temp canvas to get pixel data
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const ctx = tempCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, img.width, img.height);
    const pixels = imageData.data;

    // Convert to linear float RGBA
    const floatData = new Float32Array(img.width * img.height * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        floatData[i] = srgbToLinearTable[pixels[i]];
        floatData[i + 1] = srgbToLinearTable[pixels[i + 1]];
        floatData[i + 2] = srgbToLinearTable[pixels[i + 2]];
        floatData[i + 3] = pixels[i + 3] / 255.0;
    }

    return { data: floatData, width: img.width, height: img.height };
}

function createTextureFromLinearData(linearData) {
    const { data, width, height } = linearData;

    // Validate before replacing the current image.
    const limit = gpu_device.limits.maxTextureDimension2D;
    if (width < 1 || height < 1 || width > limit || height > limit) {
        throw new Error(`Image dimensions ${width}×${height} exceed the supported range of 1–${limit}.`);
    }

    // Destroy old texture if exists
    if (tex_source) {
        tex_source.destroy();
    }

    // Clear cached textures (pyramid sizes depend on image size)
    clearTextureCache();

    tex_source = createTexture2D(width, height);

    gpu_device.queue.writeTexture(
        { texture: tex_source },
        data,
        { bytesPerRow: width * 4 * 4 },
        { width, height }
    );

    return { width, height };
}

async function loadEXR(file) {
    const arrayBuffer = await file.arrayBuffer();
    const result = window.parseEXR(arrayBuffer);

    // The adapted loader returns bottom-to-top rows; flip for the canvas.
    const { width, height, data } = result;
    const flipped = new Float32Array(data.length);
    const rowSize = width * 4; // RGBA
    for (let y = 0; y < height; y++) {
        const srcRow = (height - 1 - y) * rowSize;
        const dstRow = y * rowSize;
        flipped.set(data.subarray(srcRow, srcRow + rowSize), dstRow);
    }

    return { data: flipped, width, height };
}

let renderingVideo = false;
let benchmarking = false;
let loadingImage = false;
let imageLoadId = 0;

async function handleImageFile(file) {
    if (renderingVideo || benchmarking || !gpu_device) return;
    const loadId = ++imageLoadId;
    loadingImage = true;
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    try {
        statusEl.textContent = 'Loading image...';
        errorEl.textContent = '';
        // Sample fetches and local files share one ordering and loading state.
        if (typeof file === 'string') {
            const src = file;
            const response = await fetch(src);
            if (!response.ok) throw new Error(`Failed to fetch ${src}`);
            const blob = await response.blob();
            if (loadId !== imageLoadId) return;
            file = new File([blob], src.split('/').pop(), { type: blob.type });
        }

        let linearData;
        const isEXR = file.name.toLowerCase().endsWith('.exr');

        if (isEXR) {
            statusEl.textContent = 'Parsing EXR file...';
            linearData = await loadEXR(file);
            if (loadId !== imageLoadId) return;
        } else {
            const img = await loadImage(file);
            if (loadId !== imageLoadId) return;
            statusEl.textContent = `Converting to linear (${img.width}x${img.height})...`;
            linearData = imageToLinearFloat(img);
        }

        statusEl.textContent = 'Uploading to GPU...';

        const { width, height } = createTextureFromLinearData(linearData);

        // Resize canvas to match image (internal resolution)
        canvas.width = width;
        canvas.height = height;
        gpu_ctx.configure({
            device: gpu_device,
            format: gpu_canvas_format,
            alphaMode: 'premultiplied',
        });

        // Store size and constrain display to fit viewport
        cur_image_size = { width, height };
        fitCanvasToViewport(width, height);

        // Reset texture selection and render
        resetTextureSelection();
        await render();

        if (loadId !== imageLoadId) return;
        statusEl.textContent = `Loaded: ${file.name} (${width}x${height})`;
    } catch (e) {
        if (loadId !== imageLoadId) return;
        errorEl.textContent = `Error: ${e.message}`;
        statusEl.textContent = 'Failed to load image.';
        console.error('Image load error:', e);
    } finally {
        if (loadId === imageLoadId) loadingImage = false;
    }
}

function ensureBlurTextures(width, height, outputExtraUsage = 0) {
    // Recreate the output when switching between render and compute blur paths.
    const storageUsage = outputExtraUsage & GPUTextureUsage.STORAGE_BINDING;
    if (!tex_blurred || tex_blurred.width !== width || tex_blurred.height !== height ||
        (tex_blurred.usage & GPUTextureUsage.STORAGE_BINDING) !== storageUsage) {
        if (tex_blurred) tex_blurred.destroy();
        tex_blurred = createTexture2D(width, height, outputExtraUsage);
    }
}

// ================ Texture list management

function updateTextureList() {
    const list = document.getElementById('textureList');

    // Clear existing options
    list.innerHTML = '';

    // Add source image option
    const sourceOption = document.createElement('option');
    sourceOption.value = -2;
    sourceOption.textContent = `Source Input: ${cur_image_size.width}×${cur_image_size.height}`;
    list.appendChild(sourceOption);

    // Add intermediate textures
    for (let i = 0; i < intermediateTextures.length; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = intermediateTextures[i].name;
        list.appendChild(option);
    }

    // Add final output option
    const finalOption = document.createElement('option');
    finalOption.value = -1;
    finalOption.textContent = `Blurred Output: ${cur_image_size.width}×${cur_image_size.height}`;
    finalOption.className = 'final-output';
    list.appendChild(finalOption);

    // Select current index (or final if out of range)
    if (selectedTextureIndex >= intermediateTextures.length && selectedTextureIndex >= 0) {
        selectedTextureIndex = -1;
    }
    list.value = selectedTextureIndex;
}

function resetTextureSelection() {
    selectedTextureIndex = -1;
    const list = document.getElementById('textureList');
    if (list) list.value = -1;
}

function getDisplayTexture(blurredOutput) {
    if (selectedTextureIndex === -2) {
        return tex_source;
    }
    if (selectedTextureIndex >= 0 && selectedTextureIndex < intermediateTextures.length) {
        return intermediateTextures[selectedTextureIndex].texture;
    }
    return blurredOutput;
}

// ================ Rendering

async function render(captureFrame = null, blurOnly = false) {
    if (gpuDeviceLost || !gpu_device || !tex_source) return;

    const { width, height } = cur_image_size;
    if (width === 0 || height === 0) return;

    const hasBlur = blur_params.radius_x > 0 || blur_params.radius_y > 0;
    // Allocate an output only when a blur actually needs it.
    const recursiveBlur = blur_params.mode === BlurMode.FAST_GAUSSIAN &&
        Math.max(blur_params.radius_x, blur_params.radius_y) >= 9;
    if (hasBlur) ensureBlurTextures(width, height, (recursiveBlur || blur_params.mode === BlurMode.RYG) ? GPUTextureUsage.STORAGE_BINDING : 0);

    // Reset resource pools for this frame
    resetKawaseUniformBufferPool();
    smolUniformBufferIndex = 0;
    resetTextureCache();
    intermediateTextures = [];

    const commandEncoder = gpu_device.createCommandEncoder();

    // Determine which texture to display (before selection override)
    let blurredOutput = tex_source;

    // Apply blur if radius > 0
    if (hasBlur) {
        if (blur_params.mode === BlurMode.RYG) {
            blurRyg(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.DUAL_KAWASE) {
            blurDualKawase(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.FAST_GAUSSIAN) {
            blurFastGaussian(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.SKIA_GAUSSIAN) {
            skiaGaussian.blur(commandEncoder, tex_source, tex_blurred,
                blur_params.radius_x, blur_params.radius_y, intermediateTextures);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.SMOL_GAUSSIAN) {
            blurSmolGaussian(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else {
            const tex_blur_tmp = blur_params.radius_x > 0 && blur_params.radius_y > 0
                ? getCachedTexture(width, height) : tex_blurred;
            // Horizontal pass: input -> temp (or directly to output for X only)
            if (blur_params.radius_x > 0) {
                separablePass(commandEncoder, tex_source, tex_blur_tmp, blur_params.mode, true, blur_params.radius_x);
                intermediateTextures.push({
                    texture: tex_blur_tmp,
                    name: `Horizontal: ${tex_blur_tmp.width}×${tex_blur_tmp.height}`
                });
            }
            // Vertical pass: temp -> output (or input -> output if no horizontal)
            if (blur_params.radius_y > 0) {
                const vertInput = blur_params.radius_x > 0 ? tex_blur_tmp : tex_source;
                separablePass(commandEncoder, vertInput, tex_blurred, blur_params.mode, false, blur_params.radius_y);
                blurredOutput = tex_blurred;
            } else {
                blurredOutput = tex_blur_tmp;
            }
        }
    }

    if (blurOnly) {
        gpu_device.queue.submit([commandEncoder.finish()]);
        return;
    }

    // Update the texture list UI
    updateTextureList();

    // Get the texture to display based on selection
    const textureToDisplay = getDisplayTexture(blurredOutput);

    // Create bind group for final display
    const displayBindGroup = gpu_device.createBindGroup({
        layout: pip_display.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: textureToDisplay.createView() },
        ],
    });

    // Final pass: render to screen with sRGB conversion
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: gpu_ctx.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(pip_display);
    renderPass.setBindGroup(0, displayBindGroup);
    renderPass.draw(3);
    renderPass.end();

    gpu_device.queue.submit([commandEncoder.finish()]);
    // Snapshot in the same task, before WebGPU presents/clears the canvas.
    if (captureFrame) return captureFrame();
}

// ================ Event handlers

function setupEventHandlers() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    // Texture list selection
    document.getElementById('textureList').addEventListener('change', (e) => {
        selectedTextureIndex = parseInt(e.target.value);
        render();
    });

    // Click to browse
    dropzone.addEventListener('click', (e) => {
        if (e.target !== fileInput) fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageFile(e.target.files[0]);
            fileInput.value = '';
        }
    });

    // Window resize
    window.addEventListener('resize', () => {
        if (cur_image_size.width > 0) {
            fitCanvasToViewport(cur_image_size.width, cur_image_size.height);
        }
    });

    // Drag and drop
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleImageFile(files[0]);
        }
    });

    // Sample file links
    document.querySelectorAll('.sample-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            handleImageFile(link.dataset.src);
        });
    });

    const rygBoxCount = document.getElementById('rygBoxCount');
    rygBoxCount.addEventListener('input', () => {
        blur_params.ryg_box_count = Number(rygBoxCount.value);
        document.getElementById('rygBoxCountValue').textContent = rygBoxCount.value;
        resetTextureSelection();
        onBlurParamsChanged();
    });

    // Blur mode radio buttons
    const disableSmol4xReduction = document.getElementById('disableSmol4xReduction');
    disableSmol4xReduction.disabled = blur_params.mode !== BlurMode.SMOL_GAUSSIAN;
    disableSmol4xReduction.addEventListener('change', (e) => {
        blur_params.disable_smol_4x_reduction = e.target.checked;
        resetTextureSelection();
        onBlurParamsChanged();
    });
    document.querySelectorAll('input[name="blurMode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            blur_params.mode = e.target.value;
            rygBoxCount.disabled = blur_params.mode !== BlurMode.RYG;
            disableSmol4xReduction.disabled = blur_params.mode !== BlurMode.SMOL_GAUSSIAN;
            // Reset texture selection to final output when blur mode changes
            resetTextureSelection();
            onBlurParamsChanged();
        });
    });

    // Radius X slider
    const radiusX = document.getElementById('radiusX');
    const radiusXValue = document.getElementById('radiusXValue');
    const radiusY = document.getElementById('radiusY');
    const radiusYValue = document.getElementById('radiusYValue');
    const radiusYRow = document.getElementById('radiusYRow');
    const lockRadius = document.getElementById('lockRadius');
    const animateRadius = document.getElementById('animateRadius');
    let animationFrame = null;
    let animationStart = null;

    function setAnimatedRadius(elapsed) {
        // Grow together for the first third, then shrink both over the remainder.
        // Y starts fast and slows down; X starts slow and catches up at the end.
        const phase = (elapsed / (BLUR_ANIMATION_DURATION / 3)) % 3;
        const shrink = Math.max(0, (phase - 1) / 2);
        const x = phase < 1 ? phase : 1 - shrink ** 2;
        const y = blur_params.lock_radius ? x : phase < 1 ? phase : (1 - shrink) ** 2;
        const min = Number(radiusX.min);
        const max = Number(radiusX.max);
        blur_params.radius_x = Math.round(min + x * (max - min));
        blur_params.radius_y = Math.round(min + y * (max - min));
        radiusX.value = blur_params.radius_x;
        radiusY.value = blur_params.radius_y;
        radiusXValue.textContent = blur_params.radius_x;
        radiusYValue.textContent = blur_params.radius_y;
    }

    function animateBlurRadius(timestamp) {
        if (!animateRadius.checked) return;
        if (animationStart === null) animationStart = timestamp;
        setAnimatedRadius(timestamp - animationStart);
        onBlurParamsChanged();
        animationFrame = requestAnimationFrame(animateBlurRadius);
    }

    animateRadius.addEventListener('change', () => {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        animationStart = null;
        if (animateRadius.checked) animationFrame = requestAnimationFrame(animateBlurRadius);
    });

    const renderVideo = document.getElementById('renderVideo');
    const videoStatus = document.getElementById('videoStatus');
    let videoURL = null;
    renderVideo.addEventListener('click', () => renderVideoCycle());

    const benchmarkButton = document.getElementById('benchmark');
    const benchmarkStatus = document.getElementById('benchmarkStatus');
    let benchmarkURL = null;
    let cancelBenchmark = false;
    benchmarkButton.addEventListener('click', async () => {
        if (benchmarking) { cancelBenchmark = true; benchmarkButton.disabled = true; return; }
        if (renderingVideo) return;
        if (gpuDeviceLost || !gpu_device || !tex_source || loadingImage) {
            benchmarkStatus.textContent = 'Load an image before benchmarking.';
            return;
        }
        const selectedModes = new Set([...document.querySelectorAll('input[name="benchmarkMode"]:checked')].map(control => control.value));
        if (selectedModes.size === 0) {
            benchmarkStatus.textContent = 'Select at least one blur mode to benchmark.';
            return;
        }
        benchmarking = true;
        cancelBenchmark = false;
        const savedParams = { ...blur_params };
        const savedSelection = selectedTextureIndex;
        const resumeAnimation = animateRadius.checked;
        const controls = [...document.querySelectorAll('input, select, button')];
        const disabledStates = controls.map(control => control.disabled);
        animateRadius.checked = false;
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        animationStart = null;
        controls.forEach(control => { control.disabled = true; });
        benchmarkButton.disabled = false;
        benchmarkButton.textContent = 'Cancel benchmark';
        dropzone.inert = true;
        let gpuError = null;
        const onGPUError = event => { gpuError = event.error; };
        gpu_device.addEventListener('uncapturederror', onGPUError);
        try {
            const results = await benchmarkBlur({
                device: gpu_device,
                methods: [
                    { mode: BlurMode.GAUSSIAN, name: 'Gaussian', color: '#c6534a' },
                    { mode: BlurMode.FAST_GAUSSIAN, name: 'Fast Gaussian', color: '#3277ad' },
                    { mode: BlurMode.DUAL_KAWASE, name: 'Dual Kawase', color: '#9554a0', lineWidth: 2, dashArray: '7 4' },
                    { mode: BlurMode.SKIA_GAUSSIAN, name: 'Skia Gaussian', color: '#b77b22' },
                    { mode: BlurMode.RYG, name: 'Ryg Blur', color: '#168c91', lineWidth: 2, dashArray: '1 5', boxCount: blur_params.ryg_box_count },
                    { mode: BlurMode.SMOL_GAUSSIAN, name: 'Smol Gaussian', color: '#37834c', emphasized: true },
                ].filter(method => selectedModes.has(method.mode)),
                setCase: (mode, radius) => {
                    Object.assign(blur_params, { mode, radius_x: radius, radius_y: radius, lock_radius: true });
                },
                renderFrame: () => render(null, true),
                onProgress: message => { benchmarkStatus.textContent = message; },
                isCancelled: () => {
                    if (gpuError) throw gpuError;
                    return cancelBenchmark;
                },
            });
            const svg = makeBenchmarkSVG(results, cur_image_size.width, cur_image_size.height);
            if (benchmarkURL) URL.revokeObjectURL(benchmarkURL);
            benchmarkURL = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
            // The locally generated SVG is also the exact downloadable artifact.
            const preview = new DOMParser().parseFromString(svg, 'image/svg+xml').documentElement;
            const result = document.getElementById('benchmarkResult');
            result.replaceChildren(document.importNode(preview, true));
            result.hidden = false;
            const download = document.createElement('a');
            download.href = benchmarkURL;
            download.download = `blur-benchmark-${cur_image_size.width}x${cur_image_size.height}.svg`;
            download.textContent = 'Download SVG';
            const stopped = results.series.filter(s => s.cutoff).map(s => `${s.name} at radius ${s.cutoff.radius}`);
            benchmarkStatus.replaceChildren(`Benchmark complete. ${stopped.length ? '1.5 s cutoff: ' + stopped.join(', ') + '. ' : ''}`, download);
            result.appendChild(download.cloneNode(true));
        } catch (error) {
            benchmarkStatus.textContent = cancelBenchmark ? 'Benchmark cancelled.' : `Benchmark failed: ${error.message}`;
        } finally {
            gpu_device.removeEventListener('uncapturederror', onGPUError);
            benchmarking = false;
            Object.assign(blur_params, savedParams);
            selectedTextureIndex = savedSelection;
            controls.forEach((control, i) => { control.disabled = disabledStates[i]; });
            benchmarkButton.textContent = 'Benchmark';
            dropzone.inert = false;
            await render();
            if (gpuDeviceLost) {
                benchmarkButton.disabled = true;
                renderVideo.disabled = true;
            }
            animateRadius.checked = resumeAnimation && !gpuDeviceLost;
            if (resumeAnimation && !gpuDeviceLost) animationFrame = requestAnimationFrame(animateBlurRadius);
        }
    });

    async function renderVideoCycle() {
        if (renderingVideo || benchmarking) return;
        if (gpuDeviceLost || !gpu_device || !tex_source || loadingImage) {
            videoStatus.textContent = 'Load an image before rendering a video.';
            return;
        }
        if (typeof VideoEncoder === 'undefined') {
            videoStatus.textContent = 'Video export requires a browser with WebCodecs video encoding (HTTPS or localhost).';
            return;
        }
        renderingVideo = true;
        const resumeAnimation = animateRadius.checked;
        const savedParams = { ...blur_params };
        const savedSelection = selectedTextureIndex;
        animateRadius.checked = false;
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        animationStart = null;
        const controls = [...document.querySelectorAll('input, select, button')];
        const disabledStates = controls.map(control => control.disabled);
        lockRadius.checked = false;
        blur_params.lock_radius = false;
        radiusY.disabled = false;
        radiusYRow.classList.remove('disabled');
        resetTextureSelection();
        controls.forEach(control => { control.disabled = true; });
        const dropzone = document.getElementById('dropzone');
        dropzone.inert = true;
        videoStatus.textContent = 'Preparing video…';
        if (videoURL) { URL.revokeObjectURL(videoURL); videoURL = null; }
        try {
            const method = blur_params.mode;
            const blob = await exportBlurVideo({
                canvas: document.getElementById('canvas'),
                renderFrame: (elapsed, capture) => {
                    setAnimatedRadius(elapsed);
                    return render(capture);
                },
                onProgress: (done, total) => {
                    videoStatus.textContent = `Rendering video: ${done}/${total} frames…`;
                },
            });
            videoURL = URL.createObjectURL(blob);
            const download = document.createElement('a');
            download.href = videoURL;
            download.download = `blur-anim-${method}.mp4`;
            download.textContent = 'Download again';
            videoStatus.replaceChildren(download);
            download.click();
            videoStatus.prepend(`Video rendered (${BLUR_ANIMATION_DURATION / 1000}s video, 60 fps). `);
        } catch (error) {
            videoStatus.textContent = `Video export failed: ${error.message}`;
        } finally {
            renderingVideo = false;
            controls.forEach((control, i) => { control.disabled = disabledStates[i]; });
            dropzone.inert = false;
            Object.assign(blur_params, savedParams);
            lockRadius.checked = savedParams.lock_radius;
            radiusYRow.classList.toggle('disabled', savedParams.lock_radius);
            radiusX.value = radiusXValue.textContent = savedParams.radius_x;
            radiusY.value = radiusYValue.textContent = savedParams.radius_y;
            selectedTextureIndex = savedSelection;
            render();
            animateRadius.checked = resumeAnimation;
            if (resumeAnimation) animationFrame = requestAnimationFrame(animateBlurRadius);
        }
    }

    radiusX.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        blur_params.radius_x = value;
        radiusXValue.textContent = value;

        if (blur_params.lock_radius) {
            blur_params.radius_y = value;
            radiusY.value = value;
            radiusYValue.textContent = value;
        }
        onBlurParamsChanged();
    });

    // Radius Y slider
    radiusY.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        blur_params.radius_y = value;
        radiusYValue.textContent = value;
        onBlurParamsChanged();
    });

    // Lock checkbox
    lockRadius.addEventListener('change', (e) => {
        blur_params.lock_radius = e.target.checked;
        radiusY.disabled = e.target.checked;
        radiusYRow.classList.toggle('disabled', e.target.checked);

        if (e.target.checked) {
            // Sync Y to X when locking
            blur_params.radius_y = blur_params.radius_x;
            radiusY.value = blur_params.radius_x;
            radiusYValue.textContent = blur_params.radius_x;
            onBlurParamsChanged();
        }
    });
}

function onBlurParamsChanged() {
    render();
}

async function main() {
    if (await initWebGPU()) setupEventHandlers();
}
main();
</script>
