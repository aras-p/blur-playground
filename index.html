<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Playground</title>
<style>
* {
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 10px;
    background: #1a1a1a;
    color: #e0e0e0;
}
.controls {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: flex-start;
}
.dropzone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 10px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
    max-width: 140px;
    line-height: 1.4;
}
.dropzone:hover, .dropzone.dragover {
    border-color: #888;
    background-color: #252525;
}
.dropzone input {
    display: none;
}
.sample-files {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
}
.sample-link {
    font-size: 11px;
    color: #888;
    text-decoration: none;
}
.sample-link:hover {
    color: #aaa;
    text-decoration: underline;
}
.main-container {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}
#canvas {
    border: 1px solid #333;
    max-width: 100%;
    background: #000;
}
.texture-list-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 180px;
}
.texture-list-container label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}
#textureList {
    background: #252525;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 12px;
    font-family: monospace;
    min-height: 300px;
    max-height: 600px;
    overflow-y: auto;
}
#textureList option {
    padding: 4px 8px;
}
#textureList option:checked {
    background: #444;
}
#textureList option.final-output {
    font-weight: bold;
}
#renderVideo, #timeNoopVideo {
    margin-top: 5px;
    padding: 6px 10px;
    background: #383838;
    border: 1px solid #555;
    border-radius: 4px;
    color: #e0e0e0;
    cursor: pointer;
}
#renderVideo:disabled, #timeNoopVideo:disabled { opacity: 0.5; cursor: default; }
#videoStatus { max-width: 290px; font-size: 12px; color: #bbb; }
#videoStatus a { color: #acd1ff; }
#status {
    margin-top: 10px;
    color: #888;
}
#error {
    color: #ff6b6b;
    margin-top: 10px;
}
.control-group {
    background: #252525;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.control-group label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.radio-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
}
.slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.slider-row label {
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
}
.slider-row input[type="range"] {
    flex: 1;
    min-width: 150px;
}
.slider-row .value {
    min-width: 2.5em;
    text-align: right;
    font-family: monospace;
}
.slider-row.disabled label,
.slider-row.disabled .value {
    color: #555;
}
.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.checkbox-row label {
    text-transform: none;
    color: #e0e0e0;
    font-size: 14px;
    cursor: pointer;
}
.checkbox-row input:disabled + label {
    color: #555;
    cursor: default;
}
</style>
</head>
<body>
<div class="controls">
    <div class="control-group">
        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept="image/png,image/jpeg,.exr">
            <span>Click to browse or drag & drop PNG/JPG/EXR</span>
        </div>
        <div class="sample-files">
            <a href="#" class="sample-link" data-src="exr/test_a_small.exr">test_a_small</a>
            <a href="#" class="sample-link" data-src="exr/test_b_1080p.exr">test_b_1080p</a>
        </div>
    </div>

    <div class="control-group">
        <label>Blur Mode</label>
        <div class="radio-group">
            <label><input type="radio" name="blurMode" value="box"> Box</label>
            <label><input type="radio" name="blurMode" value="tent"> Tent</label>
            <label><input type="radio" name="blurMode" value="gaussian"> Gaussian</label>
            <label><input type="radio" name="blurMode" value="fast_gaussian"> Fast Gaussian</label>
            <label><input type="radio" name="blurMode" value="reduced_gaussian" checked> Reduced Gaussian</label>
            <label><input type="radio" name="blurMode" value="skia_gaussian"> Skia Gaussian</label>
            <label><input type="radio" name="blurMode" value="dual_kawase"> Dual Kawase</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="disableReducedBlending">
            <label for="disableReducedBlending">Disable blending between levels</label>
        </div>
    </div>

    <div class="control-group">
        <label>Blur Radius</label>
        <div class="slider-row">
            <label for="radiusX">X:</label>
            <input type="range" id="radiusX" min="0" max="1000" step="1" value="96">
            <span class="value" id="radiusXValue">96</span>
        </div>
        <div class="slider-row disabled" id="radiusYRow">
            <label for="radiusY">Y:</label>
            <input type="range" id="radiusY" min="0" max="1000" step="1" value="96">
            <span class="value" id="radiusYValue">96</span>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="lockRadius">
            <label for="lockRadius">Lock X & Y</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="animateRadius">
            <label for="animateRadius">Animate</label>
        </div>
        <button type="button" id="renderVideo">Render Video</button>
        <button type="button" id="timeNoopVideo">Time no-op video</button>
        <div id="videoStatus" role="status" aria-live="polite"></div>
    </div>

</div>
<div class="main-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="texture-list-container">
        <label>Display Texture</label>
        <select id="textureList" size="8">
            <option value="-1" selected class="final-output">Blurred Output</option>
        </select>
    </div>
</div>
<div id="status">WebGPU initializing...</div>
<div id="error"></div>

<script src="js/fflate.js"></script>
<script src="js/exrloader.js"></script>
<script src="js/fast-gaussian.js"></script>
<script src="js/skia-gaussian.js"></script>
<script src="js/video-export.js"></script>
<script>
// ================ Shaders
const FULLSCREEN_VERTEX_SHADER = `
struct VertexOutput {
    @builtin(position) position: vec4f,
    @location(0) uv: vec2f,
}
@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VertexOutput {
    var o: VertexOutput;
    // full-screen triangle
    o.uv = vec2f(select(0.0, 2.0, (vid & 1u) != 0u), select(1.0, -1.0, (vid & 2u) != 0u));
    o.position = vec4f(o.uv.x * 2.0 - 1.0, -(o.uv.y * 2.0 - 1.0), 0.0, 1.0);
    return o;
}
`;

const DISPLAY_SHADER = FULLSCREEN_VERTEX_SHADER + `
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
fn linearToSrgb(x: vec3f) -> vec3f {
    return select(
        vec3f(1.055) * pow(x, vec3f(1.0/2.4)) - vec3f(0.055),
        x * vec3f(12.92),
        x < vec3f(0.0031308));
}
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let color = textureSample(tex, smp, in.uv);
    return vec4f(linearToSrgb(color.rgb), color.a);
}
`;

const SEPARABLE_BLUR_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct BlurParams {
    uvStep: vec2f,
    kernelWidth: i32,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var texKernel: texture_1d<f32>;
@group(0) @binding(3) var<uniform> params: BlurParams;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = textureSample(tex, smp, in.uv) * textureLoad(texKernel, 0, 0).r;
    for (var i: i32 = 1; i < params.kernelWidth; i++) {
        let w = textureLoad(texKernel, i, 0).r;
        let offset = params.uvStep * f32(i);
        col += textureSample(tex, smp, in.uv - offset) * w;
        col += textureSample(tex, smp, in.uv + offset) * w;
    }
    return col;
}
`;

const DK_DOWNSAMPLE_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, smp, in.uv) * 4.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5, -0.5));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5,  0.5));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5, -0.5));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5,  0.5));
    return col / 8.0;
}
`;

const DK_UPSAMPLE_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    uvStep: vec2f,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = vec4f(0.0);
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.0, -1.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.0,  1.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-1.0,  0.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 1.0,  0.0));
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5, -0.5)) * 2.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f(-0.5,  0.5)) * 2.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5, -0.5)) * 2.0;
    col += textureSample(tex, smp, in.uv + params.uvStep * vec2f( 0.5,  0.5)) * 2.0;
    return col / 12.0;
}
`;

const DK_MIX_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    ratio: f32,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let col = textureSample(tex, smp, in.uv);
    return vec4f(col.rgb, params.ratio);
}
`;

// Fixed-size, bilinear-paired Gaussian: at most 25 texture reads per axis.
const REDUCED_GAUSSIAN_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params {
    stepCenterCount: vec4f,
    taps: array<vec4f, 12>,
}
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    var col = textureSampleLevel(tex, smp, in.uv, 0.0) * params.stepCenterCount.z;
    for (var i = 0u; i < u32(params.stepCenterCount.w); i++) {
        let tap = params.taps[i];
        let offset = params.stepCenterCount.xy * tap.x;
        col += (textureSampleLevel(tex, smp, in.uv - offset, 0.0)
              + textureSampleLevel(tex, smp, in.uv + offset, 0.0)) * tap.y;
    }
    return col;
}
`;

// Integrate each destination pixel's source footprint. Exact area weights
// preserve isolated highlights even when odd dimensions change sampling phase.
const REDUCED_DOWNSAMPLE_SHADER = FULLSCREEN_VERTEX_SHADER + `
struct Params { outputSize: vec2f, }
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    let size = vec2f(textureDimensions(tex));
    // Exact halving is an area average with one bilinear sample. Unchanged
    // axes stay at texel centers; fractional/odd reductions use integration.
    if (all((size == params.outputSize) | (size == 2.0 * params.outputSize))) {
        return textureSampleLevel(tex, smp, in.position.xy / params.outputSize, 0.0);
    }
    let scale = size / params.outputSize;
    let pixel = floor(in.position.xy);
    let lo = pixel * scale;
    let hi = min((pixel + 1.0) * scale, size);
    var col = vec4f(0.0);
    // Each axis spans at most three source texels (one if it is unchanged).
    for (var y = i32(floor(lo.y)); y < i32(ceil(hi.y)); y++) {
        for (var x = i32(floor(lo.x)); x < i32(ceil(hi.x)); x++) {
            let overlap = max(vec2f(0.0), min(hi, vec2f(f32(x + 1), f32(y + 1)))
                - max(lo, vec2f(f32(x), f32(y))));
            col += textureLoad(tex, vec2i(x, y), 0) * overlap.x * overlap.y;
        }
    }
    return col / (scale.x * scale.y);
}
`;

// Reconstruct and blend all RGBA channels, without using alpha as a weight.
const REDUCED_MIX_SHADER = FULLSCREEN_VERTEX_SHADER + `
override ALL_BILINEAR: bool = false;
struct Params { ratio: vec2f, outputSize: vec2f, }
@group(0) @binding(0) var smp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;
@group(0) @binding(3) var texX: texture_2d<f32>;
@group(0) @binding(4) var texY: texture_2d<f32>;
// Bilinear through 2× enlargement on each axis; positive cubic B-spline
// beyond that to avoid coarse-grid facets without ringing. This uses one,
// two, or four bilinear samples depending on how many axes need cubic.
// Each axis returns (first position, second position, second group weight).
fn cubicAxis(uv: f32, size: f32, outputSize: f32) -> vec3f {
    if (2.0 * size >= outputSize) { return vec3f(uv, uv, 0.0); }
    let p = uv * size - 0.5;
    let base = floor(p);
    let f = p - base;
    let w0 = (1.0 - f) * (1.0 - f) * (1.0 - f) / 6.0;
    let w1 = (3.0 * f * f * f - 6.0 * f * f + 4.0) / 6.0;
    let w2 = (-3.0 * f * f * f + 3.0 * f * f + 3.0 * f + 1.0) / 6.0;
    let w3 = f * f * f / 6.0;
    let g0 = w0 + w1;
    let g1 = w2 + w3;
    return vec3f((base - 0.5 + w1 / g0) / size,
                 (base + 1.5 + w3 / g1) / size, g1);
}
fn reconstruct(image: texture_2d<f32>, uv: vec2f) -> vec4f {
    // Pipeline specialization removes the cubic path for all-bilinear draws.
    if (ALL_BILINEAR) { return textureSampleLevel(image, smp, uv, 0.0); }
    let size = vec2f(textureDimensions(image));
    let x = cubicAxis(uv.x, size.x, params.outputSize.x);
    let y = cubicAxis(uv.y, size.y, params.outputSize.y);
    var a = textureSampleLevel(image, smp, vec2f(x.x, y.x), 0.0);
    if (2.0 * size.x < params.outputSize.x) {
        a = mix(a, textureSampleLevel(image, smp, vec2f(x.y, y.x), 0.0), x.z);
    }
    if (2.0 * size.y < params.outputSize.y) {
        var b = textureSampleLevel(image, smp, vec2f(x.x, y.y), 0.0);
        if (2.0 * size.x < params.outputSize.x) {
            b = mix(b, textureSampleLevel(image, smp, vec2f(x.y, y.y), 0.0), x.z);
        }
        a = mix(a, b, y.z);
    }
    return a;
}
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
    // Triangle weights: base, dominant-axis neighbor, diagonal neighbor.
    var color = reconstruct(tex, in.uv) * (1.0 - params.ratio.x - params.ratio.y);
    if (params.ratio.x > 0.0) {
        color += reconstruct(texX, in.uv) * params.ratio.x;
    }
    if (params.ratio.y > 0.0) {
        color += reconstruct(texY, in.uv) * params.ratio.y;
    }
    return color;
}
`;

// ================ WebGPU state

/** @type {GPUDevice} */
let gpu_device = null;
/** @type {GPUCanvasContext} */
let gpu_ctx = null;
/** @type {GPUTextureFormat} */
let gpu_canvas_format = null;
/** @type {GPUSampler} */
let gpu_sampler_linear = null;
/** @type {GPUSampler} */
let gpu_sampler_point = null;
/** @type {GPUBindGroup} */
let gpu_bind_group = null;
/** @type {GPUTexture} */
let tex_source = null;
/** @type {GPUTexture} */
let tex_blurred = null;
/** @type {GPUTexture} */
let tex_blur_tmp = null;
/** @type {GPURenderPipeline} */
let pip_display = null;
/** @type {GPURenderPipeline} */
let pip_separable = null;
/** @type {GPURenderPipeline} */
let pip_dk_down = null;
/** @type {GPURenderPipeline} */
let pip_dk_up = null;
/** @type {GPURenderPipeline} */
let pip_dk_mix = null;
/** @type {SkiaGaussian} */
let skiaGaussian = null;
/** @type {GPURenderPipeline} */
let pip_reduced_gaussian = null;
let pip_reduced_down = null;
let pip_reduced_mix = null;
let pip_reduced_mix_bilinear = null;
const reducedUniformBuffers = [];
let reducedUniformBufferIndex = 0;

let cur_image_size = { width: 0, height: 0 };

// Reusable resources for Kawase blurs
/** @type {GPUBuffer[]} */
let kawaseUniformBuffers = [];
let kawaseUniformBufferIndex = 0;
let kawaseTextureCache = new Map();

// Intermediate texture tracking for visualization
// Array of { texture, name } where name is a debug string
let intermediateTextures = [];
let selectedTextureIndex = -1; // -1 means "Blurred Output"

// ================ Various helpers

function createTexture2D(width, height, extraUsage = 0) {
    return gpu_device.createTexture({
        size: [width, height],
        format: 'rgba32float',
        usage: extraUsage | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC | GPUTextureUsage.COPY_DST,
    });
}

function createSampler(filter) {
    return gpu_device.createSampler({
        magFilter: filter,
        minFilter: filter,
        addressModeU: 'clamp-to-edge',
        addressModeV: 'clamp-to-edge',
    })
}

function createPipeline(codeString, rtFormat = 'rgba32float', blending = false, constants = {}) {
    const shader_mod = gpu_device.createShaderModule({
        code: codeString,
    });
    const target = { format: rtFormat };
    if (blending) {
        target.blend = {
            color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add', },
            alpha: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add', },
        };
    }
    return gpu_device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shader_mod, entryPoint: 'vs_main', },
        fragment: { module: shader_mod, entryPoint: 'fs_main', targets: [target], constants, },
        primitive: { topology: 'triangle-list', },
    })
}

function fitCanvasToViewport(imageWidth, imageHeight) {
    const canvas = document.getElementById('canvas');
    const margin = 20; // pixels of margin around canvas

    // Available space (viewport minus controls and margins)
    const controlsHeight = document.querySelector('.controls').offsetHeight;
    const maxWidth = window.innerWidth - margin * 2;
    const maxHeight = window.innerHeight - controlsHeight - margin * 3;

    // Calculate scale to fit
    const scaleX = maxWidth / imageWidth;
    const scaleY = maxHeight / imageHeight;
    const scale = Math.min(scaleX, scaleY, 4.0); // don't scale up by more than 4x

    canvas.style.width = Math.floor(imageWidth * scale) + 'px';
    canvas.style.height = Math.floor(imageHeight * scale) + 'px';
}

// ================ Blur parameters

const BlurMode = {
    BOX: 'box',
    TENT: 'tent',
    GAUSSIAN: 'gaussian',
    FAST_GAUSSIAN: 'fast_gaussian',
    REDUCED_GAUSSIAN: 'reduced_gaussian',
    SKIA_GAUSSIAN: 'skia_gaussian',
    DUAL_KAWASE: 'dual_kawase',
};

const blur_params = {
    mode: BlurMode.REDUCED_GAUSSIAN,
    disable_reduced_blending: false,
    radius_x: 96,
    radius_y: 96,
    lock_radius: false,
};

// ================ Initialization

async function initWebGPU() {
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    if (!navigator.gpu) {
        errorEl.textContent = 'WebGPU is not supported in this browser.';
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            errorEl.textContent = 'Failed to get WebGPU adapter.';
            return false;
        }

        const requiredFeatures = ['float32-filterable', 'float32-blendable'];
        gpu_device = await adapter.requestDevice({ requiredFeatures });
        gpu_ctx = canvas.getContext('webgpu');
        gpu_canvas_format = navigator.gpu.getPreferredCanvasFormat();

        gpu_ctx.configure({
            device: gpu_device,
            format: gpu_canvas_format,
            alphaMode: 'premultiplied',
        });

        gpu_sampler_linear = createSampler('linear');
        gpu_sampler_point = createSampler('nearest');

        pip_display = createPipeline(DISPLAY_SHADER, gpu_canvas_format);
        pip_separable = createPipeline(SEPARABLE_BLUR_SHADER);
        pip_dk_down = createPipeline(DK_DOWNSAMPLE_SHADER);
        pip_dk_up = createPipeline(DK_UPSAMPLE_SHADER);
        skiaGaussian = new SkiaGaussian(gpu_device, FULLSCREEN_VERTEX_SHADER);
        pip_reduced_gaussian = createPipeline(REDUCED_GAUSSIAN_SHADER);
        pip_reduced_down = createPipeline(REDUCED_DOWNSAMPLE_SHADER);
        pip_reduced_mix = createPipeline(REDUCED_MIX_SHADER);
        pip_reduced_mix_bilinear = createPipeline(REDUCED_MIX_SHADER, undefined, false,
            { ALL_BILINEAR: true });
        pip_dk_mix = createPipeline(DK_MIX_SHADER, undefined, true);

        statusEl.textContent = 'WebGPU ready. Load an image to begin.';
        return true;
    } catch (e) {
        errorEl.textContent = `WebGPU initialization failed: ${e.message}`;
        return false;
    }
}

// ================ Image loading

// sRGB to linear conversion
function srgbToLinear(value) {
    const v = value / 255.0;
    if (v <= 0.04045) {
        return v / 12.92;
    }
    return Math.pow((v + 0.055) / 1.055, 2.4);
}

async function loadImage(file) {
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(img.src);
            reject(new Error('Failed to load image'));
        };
        img.src = URL.createObjectURL(file);
    });
}

function imageToLinearFloat(img) {
    // Draw image to temp canvas to get pixel data
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const ctx = tempCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, img.width, img.height);
    const pixels = imageData.data;

    // Convert to linear float RGBA
    const floatData = new Float32Array(img.width * img.height * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        const idx = i;
        floatData[idx] = srgbToLinear(pixels[i]);
        floatData[idx + 1] = srgbToLinear(pixels[i + 1]);
        floatData[idx + 2] = srgbToLinear(pixels[i + 2]);
        floatData[idx + 3] = pixels[i + 3] / 255.0;
    }

    return { data: floatData, width: img.width, height: img.height };
}

function createTextureFromLinearData(linearData) {
    const { data, width, height } = linearData;

    // Destroy old texture if exists
    if (tex_source) {
        tex_source.destroy();
    }

    // Clear cached textures (pyramid sizes depend on image size)
    clearTextureCache();

    tex_source = createTexture2D(width, height);

    gpu_device.queue.writeTexture(
        { texture: tex_source },
        data,
        { bytesPerRow: width * 4 * 4 },
        { width, height }
    );

    // Create bind group
    gpu_bind_group = gpu_device.createBindGroup({
        layout: pip_display.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: tex_source.createView() },
        ],
    });

    return { width, height };
}

async function loadEXR(file) {
    const arrayBuffer = await file.arrayBuffer();
    const result = window.parseEXR(arrayBuffer);

    // EXR files are stored bottom-to-top, flip vertically
    const { width, height, data } = result;
    const flipped = new Float32Array(data.length);
    const rowSize = width * 4; // RGBA
    for (let y = 0; y < height; y++) {
        const srcRow = (height - 1 - y) * rowSize;
        const dstRow = y * rowSize;
        flipped.set(data.subarray(srcRow, srcRow + rowSize), dstRow);
    }

    return { data: flipped, width, height };
}

let renderingVideo = false;
let loadingImages = 0;

async function handleImageFile(file) {
    if (renderingVideo) return;
    loadingImages++;
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const canvas = document.getElementById('canvas');

    try {
        statusEl.textContent = 'Loading image...';

        let linearData;
        const isEXR = file.name.toLowerCase().endsWith('.exr');

        if (isEXR) {
            statusEl.textContent = 'Parsing EXR file...';
            linearData = await loadEXR(file);
            statusEl.textContent = `Loaded EXR (${linearData.width}x${linearData.height})`;
        } else {
            const img = await loadImage(file);
            statusEl.textContent = `Converting to linear (${img.width}x${img.height})...`;
            linearData = imageToLinearFloat(img);
        }

        statusEl.textContent = 'Uploading to GPU...';

        const { width, height } = createTextureFromLinearData(linearData);

        // Resize canvas to match image (internal resolution)
        canvas.width = width;
        canvas.height = height;
        gpu_ctx.configure({
            device: gpu_device,
            format: gpu_canvas_format,
            alphaMode: 'premultiplied',
        });

        // Store size and constrain display to fit viewport
        cur_image_size = { width, height };
        fitCanvasToViewport(width, height);

        // Reset texture selection and render
        resetTextureSelection();
        render();

        statusEl.textContent = `Loaded: ${file.name} (${width}x${height})`;
    } catch (e) {
        errorEl.textContent = `Error: ${e.message}`;
        statusEl.textContent = 'Failed to load image.';
        console.error('Image load error:', e);
    } finally {
        loadingImages--;
    }
}

// ================ Blur kernel utilities

function separableKernelValue(mode, x) {
    x = Math.abs(x);
    switch (mode) {
        case BlurMode.BOX:
            return x > 1.0 ? 0.0 : 1.0;
        case BlurMode.TENT:
            return x > 1.0 ? 0.0 : 1.0 - x;
        case BlurMode.GAUSSIAN: {
            const scale = 1.6;
            const twoScale2 = 2.0 * scale * scale;
            x *= 3.0 * scale;
            return (1.0 / Math.sqrt(Math.PI * twoScale2)) * Math.exp(-x * x / twoScale2);
        }
        default:
            return 0.0;
    }
}

function calcSeparableWeights(mode, radius) {
    // Kernel size is radius+1, but since it is symmetric we only store one half
    const size = Math.ceil(radius) + 1;
    const weights = new Float32Array(size);

    let sum = 0.0;

    // Center weight
    const centerWeight = separableKernelValue(mode, 0.0);
    weights[0] = centerWeight;
    sum += centerWeight;

    // Other weights in the positive direction
    // Add double to the sum to account for negative direction
    const scale = radius > 0.0 ? 1.0 / radius : 0.0;
    for (let i = 1; i < size; i++) {
        const weight = separableKernelValue(mode, i * scale);
        weights[i] = weight;
        sum += weight * 2.0;
    }

    // Normalize the weights
    for (let i = 0; i < size; i++) {
        weights[i] /= sum;
    }

    // Create 1D texture for kernel weights
    const kernelTexture = gpu_device.createTexture({
        size: [size],
        format: 'r32float',
        dimension: '1d',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
    });

    gpu_device.queue.writeTexture(
        { texture: kernelTexture },
        weights,
        { bytesPerRow: size * 4 },
        { width: size }
    );

    return { texture: kernelTexture, width: size };
}

function separablePass(commandEncoder, input, output, mode, horizontal, radius) {
    const width = cur_image_size.width;
    const height = cur_image_size.height;

    // Calculate kernel weights
    const kernel = calcSeparableWeights(mode, radius);

    // Create uniform buffer for blur params
    const paramsData = new ArrayBuffer(16); // vec2f (8) + i32 (4) + padding (4)
    const paramsView = new DataView(paramsData);
    paramsView.setFloat32(0, horizontal ? 1.0 / width : 0.0, true);
    paramsView.setFloat32(4, horizontal ? 0.0 : 1.0 / height, true);
    paramsView.setInt32(8, kernel.width, true);

    const paramsBuffer = gpu_device.createBuffer({
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    // Create bind group for this pass
    const blurBindGroup = gpu_device.createBindGroup({
        layout: pip_separable.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: kernel.texture.createView() },
            { binding: 3, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_separable);
    renderPass.setBindGroup(0, blurBindGroup);
    renderPass.draw(3);
    renderPass.end();

    // Resources (kernel texture, params buffer) will be garbage collected after GPU is done
}

function ensureBlurTextures(width, height, outputExtraUsage = 0) {
    if (!tex_blur_tmp || tex_blur_tmp.width !== width || tex_blur_tmp.height !== height) {
        if (tex_blur_tmp) tex_blur_tmp.destroy();
        tex_blur_tmp = createTexture2D(width, height);
    }
    // Recreate the output when switching between render and compute blur paths.
    const storageUsage = outputExtraUsage & GPUTextureUsage.STORAGE_BINDING;
    if (!tex_blurred || tex_blurred.width !== width || tex_blurred.height !== height ||
        (tex_blurred.usage & GPUTextureUsage.STORAGE_BINDING) !== storageUsage) {
        if (tex_blurred) tex_blurred.destroy();
        tex_blurred = createTexture2D(width, height, outputExtraUsage);
    }
}

// ================ Dual Kawase blur

// Get a uniform buffer from pool (creates if needed)
function getKawaseUniformBuffer() {
    if (kawaseUniformBufferIndex >= kawaseUniformBuffers.length) {
        kawaseUniformBuffers.push(gpu_device.createBuffer({
            size: 8,  // uvStep (vec2f); also holds the mix ratio (f32)
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        }));
    }
    return kawaseUniformBuffers[kawaseUniformBufferIndex++];
}

// Reset uniform buffer pool index at start of frame
function resetKawaseUniformBufferPool() {
    kawaseUniformBufferIndex = 0;
}

// Get a cached texture with matching dimensions and usage.
function getCachedTexture(width, height, extraUsage = 0) {
    const key = `${width},${height},${extraUsage}`;
    let textures = kawaseTextureCache.get(key);
    if (!textures) {
        textures = [];
        kawaseTextureCache.set(key, textures);
    }
    // Find an unused texture or create new one
    for (const entry of textures) {
        if (!entry.inUse) {
            entry.inUse = true;
            return entry.texture;
        }
    }
    // Create new texture
    const texture = createTexture2D(width, height, extraUsage);
    textures.push({ texture, inUse: true });
    return texture;
}

// Mark all cached textures as unused (call at start of frame)
function resetTextureCache() {
    for (const textures of kawaseTextureCache.values()) {
        for (const entry of textures) {
            entry.inUse = false;
        }
    }
}

// Clear texture cache (call when image size changes)
function clearTextureCache() {
    for (const textures of kawaseTextureCache.values()) {
        for (const entry of textures) {
            entry.texture.destroy();
        }
    }
    kawaseTextureCache.clear();
}

function kawaseDownsample(commandEncoder, input, fullSizeX, fullSizeY, divisorX, divisorY, ratioX, ratioY) {
    const sizeX = Math.max(Math.floor(fullSizeX / Math.max(divisorX,1)), 1);
    const sizeY = Math.max(Math.floor(fullSizeY / Math.max(divisorY,1)), 1);
    const output = getCachedTexture(sizeX, sizeY);

    // Note: "step" is based on *output* size, which is 2x smaller than input
    const stepX = ratioX / sizeX;
    const stepY = ratioY / sizeY;

    const paramsData = new Float32Array([stepX, stepY]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_dk_down.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_dk_down);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function kawaseUpsample(commandEncoder, input, fullSizeX, fullSizeY, divisorX, divisorY, ratioX, ratioY) {
    const sizeX = Math.max(Math.floor(fullSizeX / Math.max(divisorX,1)), 1);
    const sizeY = Math.max(Math.floor(fullSizeY / Math.max(divisorY,1)), 1);
    const output = getCachedTexture(sizeX, sizeY);

    // Note: "step" is based on *input* size, which is 2x smaller than output
    const stepX = ratioX / input.width;
    const stepY = ratioY / input.height;

    const paramsData = new Float32Array([stepX, stepY]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_dk_up.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
        }],
    });

    renderPass.setPipeline(pip_dk_up);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();

    return output;
}

function kawaseMix(commandEncoder, input, output, ratio) {
    const paramsData = new Float32Array([ratio]);
    const paramsBuffer = getKawaseUniformBuffer();
    gpu_device.queue.writeBuffer(paramsBuffer, 0, paramsData);

    const bindGroup = gpu_device.createBindGroup({
        layout: pip_dk_mix.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_point },
            { binding: 1, resource: input.createView() },
            { binding: 2, resource: { buffer: paramsBuffer } },
        ],
    });

    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: output.createView(),
            loadOp: 'load',  // Important: load existing content for blending
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(pip_dk_mix);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();
}

function kawaseCopy(commandEncoder, input, output) {
    commandEncoder.copyTextureToTexture(
        { texture: input },
        { texture: output },
        [input.width, input.height]
    );
}

// Discrete radii are 0, 6, 12, 24, ... (pyramid divisors 0, 2, 4, 8, ...).
function kawaseRadiusInterval(radius) {
    const steps = Math.max(radius, 0) / 3.0;
    let lower = 0;
    let upper = 2;
    while (upper <= steps) {
        lower = upper;
        upper *= 2;
    }
    const t = (steps - lower) / (upper - lower);
    // Blending kernels interpolates variance. Remap the weight to make blur
    // width grow more evenly between doubling steps.
    return { lower, upper, fraction: t * (2.0 + t) / 3.0 };
}

function blurDualKawase(commandEncoder, input, output) {
    const x = kawaseRadiusInterval(blur_params.radius_x);
    const y = kawaseRadiusInterval(blur_params.radius_y);
    const fullSizeX = cur_image_size.width;
    const fullSizeY = cur_image_size.height;

    // Triangulate the radius cell along its lower/lower -> upper/upper diagonal.
    // Equal radii use just the two isotropic endpoints; elsewhere at most three
    // discrete kernels contribute. Adjacent triangles/cells share their edges.
    const corners = [
        { x: x.lower, y: y.lower, weight: 1.0 - Math.max(x.fraction, y.fraction) },
        x.fraction >= y.fraction
            ? { x: x.upper, y: y.lower, weight: x.fraction - y.fraction }
            : { x: x.lower, y: y.upper, weight: y.fraction - x.fraction },
        { x: x.upper, y: y.upper, weight: Math.min(x.fraction, y.fraction) },
    ].filter(corner => corner.weight > 0.0);

    // Every endpoint shares this isotropic downsample prefix and upsample suffix.
    // Blend BEFORE the shared upsampling: the filters are linear, so there is no
    // need to render several full-resolution blurs. For X=Y this is precisely one
    // pyramid plus an extra down/up pair and a mix at its smallest shared level.
    const commonLevel = Math.min(x.lower, y.lower);
    let curr = input;
    for (let i = 2; i <= commonLevel; i *= 2) {
        curr = kawaseDownsample(commandEncoder, curr, fullSizeX, fullSizeY, i, i, 1.0, 1.0);
        intermediateTextures.push({ texture: curr, name: `Down (1/${i}): ${curr.width}×${curr.height}` });
    }
    const common = curr;
    const downsampleCache = new Map();

    function renderCorner(corner) {
        let texture = common;
        const minLevel = Math.min(corner.x, corner.y);
        const maxLevel = Math.max(corner.x, corner.y);
        let path = '';
        for (let i = Math.max(commonLevel, 1) * 2; i <= maxLevel; i *= 2) {
            const doX = i <= corner.x;
            const doY = i <= corner.y;
            const divisorX = doX ? i : minLevel;
            const divisorY = doY ? i : minLevel;
            // Also share any downsample prefix within the divergent branches.
            path += `/${divisorX},${divisorY},${doX},${doY}`;
            let down = downsampleCache.get(path);
            if (!down) {
                down = kawaseDownsample(commandEncoder, texture, fullSizeX, fullSizeY,
                    divisorX, divisorY, doX ? 1.0 : 0.0, doY ? 1.0 : 0.0);
                downsampleCache.set(path, down);
                intermediateTextures.push({ texture: down, name: `Corner (${corner.x},${corner.y}) down: ${down.width}×${down.height}` });
            }
            texture = down;
        }
        // Keep the existing discrete pass sequence, including its inactive-axis
        // divisors and offsets. Stop where the common upsample suffix begins.
        for (let i = Math.floor(maxLevel / 2); i >= Math.max(commonLevel, 1); i = Math.floor(i / 2)) {
            texture = kawaseUpsample(commandEncoder, texture, fullSizeX, fullSizeY,
                i <= corner.x ? i : minLevel, i <= corner.y ? i : minLevel,
                i <= corner.x ? 1.0 : 0.0, i <= corner.y ? 1.0 : 0.0);
            intermediateTextures.push({ texture, name: `Corner (${corner.x},${corner.y}) up: ${texture.width}×${texture.height}` });
        }
        return texture;
    }

    const textures = corners.map(renderCorner);
    // The last corner owns a filtered texture whenever blending is needed;
    // never blend into the source or the saved common pyramid texture.
    curr = textures[textures.length - 1];
    let weight = corners[corners.length - 1].weight;
    for (let i = corners.length - 2; i >= 0; --i) {
        weight += corners[i].weight;
        kawaseMix(commandEncoder, textures[i], curr, corners[i].weight / weight);
    }
    if (corners.length > 1) {
        intermediateTextures.push({ texture: curr, name: `Interpolated (${blur_params.radius_x},${blur_params.radius_y}): ${curr.width}×${curr.height}` });
    }

    for (let i = Math.floor(commonLevel / 2); i >= 1; i = Math.floor(i / 2)) {
        curr = kawaseUpsample(commandEncoder, curr, fullSizeX, fullSizeY, i, i, 1.0, 1.0);
        if (i > 1) {
            intermediateTextures.push({ texture: curr, name: `Up (1/${i}): ${curr.width}×${curr.height}` });
        }
    }
    kawaseCopy(commandEncoder, curr, output);
}

// ================ Reduced Gaussian blur

function reducedPass(encoder, pipeline, input, output, data, other = null) {
    const index = reducedUniformBufferIndex++;
    if (!reducedUniformBuffers[index]) {
        reducedUniformBuffers[index] = gpu_device.createBuffer({
            size: 208, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });
    }
    const buffer = reducedUniformBuffers[index];
    gpu_device.queue.writeBuffer(buffer, 0, data);
    const entries = [
        { binding: 1, resource: input.createView() },
        { binding: 2, resource: { buffer } },
    ];
    entries.push({ binding: 0, resource: gpu_sampler_linear });
    if (other) other.forEach((tex, i) => entries.push({ binding: 3 + i, resource: tex.createView() }));
    const pass = encoder.beginRenderPass({colorAttachments: [{
        view: output.createView(), loadOp: 'clear', storeOp: 'store',
        clearValue: { r: 0, g: 0, b: 0, a: 0 },
    }]});
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, gpu_device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0), entries,
    }));
    pass.draw(3);
    pass.end();
}

function reducedAxisPlan(radius, size) {
    const sigma = Math.max(0, radius) / 3;
    let level = 0;
    // Ceil-sized levels support odd dimensions and stop at a single texel.
    const maxLevel = Math.ceil(Math.log2(size));
    const scale = level => size / Math.ceil(size / 2 ** level);
    while (level < maxLevel && sigma >= 6 * scale(level)) level++;
    const t = Math.min(1, Math.max(0, sigma / scale(level) - 5));
    return { sigma, level, blend: level < maxLevel ? t * t * (3 - 2 * t) : 0 };
}

function reducedGaussianAxis(encoder, input, sigma, horizontal, destination = null) {
    if (sigma < 0.01 || (horizontal ? input.width : input.height) === 1) return input;
    const data = new Float32Array(52);
    data[0] = horizontal ? 1 / input.width : 0;
    data[1] = horizontal ? 0 : 1 / input.height;
    // Smoothly taper the last sigma of the support. Changing tap count then
    // introduces zero-weight taps, avoiding small jumps during animation.
    const weight = i => {
        const x = i / sigma;
        const t = Math.max(0, Math.min(1, 4 - x));
        return Math.exp(-0.5 * x * x) * t * t * (3 - 2 * t);
    };
    const count = Math.min(12, Math.ceil(4 * sigma / 2));
    let sum = 1;
    for (let j = 0; j < count; j++) {
        const i = 2 * j + 1;
        const a = weight(i), b = weight(i + 1), w = a + b;
        data[4 + j * 4] = w > 0 ? i + b / w : i;
        data[5 + j * 4] = w;
        sum += 2 * w;
    }
    data[2] = 1 / sum;
    data[3] = count;
    for (let j = 0; j < count; j++) data[5 + j * 4] /= sum;
    const output = destination ?? getCachedTexture(input.width, input.height);
    reducedPass(encoder, pip_reduced_gaussian, input, output, data);
    return output;
}

// Reconstruction variance in output pixels, matching the shader's per-axis
// filter choice. At exact 2×, bilinear phases are 1/4 and 3/4 (variance 3/16
// in source texels); fractional odd-size scales use the phase average 1/6.
function reconstructionVariance(scale) {
    if (scale === 1) return 0;
    return scale * scale * (scale > 2 ? 1 / 3 : scale === 2 ? 3 / 16 : 1 / 6);
}

function blurReducedGaussian(encoder, input, output) {
    const x = reducedAxisPlan(blur_params.radius_x, input.width);
    const y = reducedAxisPlan(blur_params.radius_y, input.height);
    // Keep the selected levels, but skip neighboring endpoints and switch
    // levels abruptly at the existing reduction thresholds.
    if (blur_params.disable_reduced_blending) x.blend = y.blend = 0;
    const levels = new Map();
    levels.set('0,0', { texture: input, vx: 0, vy: 0 });
    // Share a canonical reduction tree between at most three endpoints.
    function down(lx, ly) {
        const key = `${lx},${ly}`;
        if (levels.has(key)) return levels.get(key);
        // First reduce both axes together to their common level, then the
        // remaining axis. Neighboring rectangular endpoints thus reuse the
        // expensive large-image prefix instead of starting shifted pyramids.
        // This route depends only on the endpoint, not the blend weights: odd
        // dimensions must follow the same resampling path across transitions.
        const prev = lx > ly ? down(lx - 1, ly)
            : ly > lx ? down(lx, ly - 1) : down(lx - 1, ly - 1);
        const src = prev.texture;
        const width = Math.ceil(input.width / 2 ** lx);
        const height = Math.ceil(input.height / 2 ** ly);
        const texture = getCachedTexture(width, height);
        reducedPass(encoder, pip_reduced_down, src, texture,
            new Float32Array([width, height]));
        // Box reduction variance in original texels; approximate for odd sizes.
        const entry = { texture,
            vx: ((input.width / width) ** 2 - 1) / 12,
            vy: ((input.height / height) ** 2 - 1) / 12,
        };
        levels.set(key, entry);
        intermediateTextures.push({ texture, name: `Reduced ${width}×${height}` });
        return entry;
    }
    function endpoint(lx, ly, destination = null) {
        const entry = down(lx, ly);
        const sx = input.width / entry.texture.width;
        const sy = input.height / entry.texture.height;
        const sigmaX = Math.sqrt(Math.max(0, x.sigma ** 2 - entry.vx - reconstructionVariance(sx))) / sx;
        const sigmaY = Math.sqrt(Math.max(0, y.sigma ** 2 - entry.vy - reconstructionVariance(sy))) / sy;
        const filterY = sigmaY >= 0.01 && entry.texture.height > 1;
        let tex = reducedGaussianAxis(encoder, entry.texture, sigmaX, true,
            filterY ? null : destination);
        tex = reducedGaussianAxis(encoder, tex, sigmaY, false, destination);
        intermediateTextures.push({ texture: tex, name: `Gaussian ${tex.width}×${tex.height}` });
        return tex;
    }
    // Reconstruct each endpoint directly on the output grid. An intermediate
    // resize here would add blur that disappears at the level boundary.
    // With no resizing or blending, write the final Gaussian axis directly
    // to the output instead of running a full-resolution reconstruction pass.
    const direct = x.level === 0 && y.level === 0 && x.blend === 0 && y.blend === 0;
    const a = endpoint(x.level, y.level, direct ? output : null);
    if (direct) {
        // Both axes can be bypassed for zero/tiny radii or one-pixel images.
        if (a !== output) encoder.copyTextureToTexture(
            { texture: a }, { texture: output }, [output.width, output.height]);
        return;
    }
    const middleWeight = Math.abs(x.blend - y.blend);
    const diagonalWeight = Math.min(x.blend, y.blend);
    // Split the blend square along (0,0)--(1,1). On that diagonal only
    // matching-resolution endpoints contribute; elsewhere use one neighbor.
    const b = middleWeight > 0
        ? endpoint(x.level + (x.blend > y.blend ? 1 : 0),
                   y.level + (y.blend > x.blend ? 1 : 0)) : a;
    const c = diagonalWeight > 0 ? endpoint(x.level + 1, y.level + 1) : a;
    // Inactive neighbors alias a. Check every sampled endpoint, including
    // coarser neighbors during transitions, before choosing the simple shader.
    const allBilinear = [a, b, c].every(tex =>
        2 * tex.width >= output.width && 2 * tex.height >= output.height);
    reducedPass(encoder, allBilinear ? pip_reduced_mix_bilinear : pip_reduced_mix, a, output,
        new Float32Array([middleWeight, diagonalWeight, output.width, output.height]), [b, c]);
}

// ================ Texture list management

function updateTextureList() {
    const list = document.getElementById('textureList');

    // Clear existing options
    list.innerHTML = '';

    // Add source image option
    const sourceOption = document.createElement('option');
    sourceOption.value = -2;
    sourceOption.textContent = `Source Input: ${cur_image_size.width}×${cur_image_size.height}`;
    list.appendChild(sourceOption);

    // Add intermediate textures
    for (let i = 0; i < intermediateTextures.length; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = intermediateTextures[i].name;
        list.appendChild(option);
    }

    // Add final output option
    const finalOption = document.createElement('option');
    finalOption.value = -1;
    finalOption.textContent = `Blurred Output: ${cur_image_size.width}×${cur_image_size.height}`;
    finalOption.className = 'final-output';
    list.appendChild(finalOption);

    // Select current index (or final if out of range)
    if (selectedTextureIndex >= intermediateTextures.length && selectedTextureIndex >= 0) {
        selectedTextureIndex = -1;
    }
    list.value = selectedTextureIndex;
}

function resetTextureSelection() {
    selectedTextureIndex = -1;
    const list = document.getElementById('textureList');
    if (list) list.value = -1;
}

function getDisplayTexture(blurredOutput) {
    if (selectedTextureIndex === -2) {
        return tex_source;
    }
    if (selectedTextureIndex >= 0 && selectedTextureIndex < intermediateTextures.length) {
        return intermediateTextures[selectedTextureIndex].texture;
    }
    return blurredOutput;
}

// ================ Rendering

async function render(captureFrame = null, skipBlur = false) {
    if (!gpu_device || !tex_source) return;

    const { width, height } = cur_image_size;
    if (width === 0 || height === 0) return;

    // Ensure blur textures exist
    const recursiveBlur = blur_params.mode === BlurMode.FAST_GAUSSIAN &&
        Math.max(blur_params.radius_x, blur_params.radius_y) >= 9;
    ensureBlurTextures(width, height, recursiveBlur ? GPUTextureUsage.STORAGE_BINDING : 0);

    // Reset resource pools for this frame
    resetKawaseUniformBufferPool();
    reducedUniformBufferIndex = 0;
    resetTextureCache();
    intermediateTextures = [];

    const commandEncoder = gpu_device.createCommandEncoder();
    const hasBlur = !skipBlur && (blur_params.radius_x > 0 || blur_params.radius_y > 0);

    // Determine which texture to display (before selection override)
    let blurredOutput = tex_source;

    // Apply blur if radius > 0
    if (hasBlur) {
        if (blur_params.mode === BlurMode.DUAL_KAWASE) {
            blurDualKawase(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.FAST_GAUSSIAN) {
            blurFastGaussian(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.SKIA_GAUSSIAN) {
            skiaGaussian.blur(commandEncoder, tex_source, tex_blurred,
                blur_params.radius_x, blur_params.radius_y, intermediateTextures);
            blurredOutput = tex_blurred;
        } else if (blur_params.mode === BlurMode.REDUCED_GAUSSIAN) {
            blurReducedGaussian(commandEncoder, tex_source, tex_blurred);
            blurredOutput = tex_blurred;
        } else {
            // Horizontal pass: input -> temp
            if (blur_params.radius_x > 0) {
                separablePass(commandEncoder, tex_source, tex_blur_tmp, blur_params.mode, true, blur_params.radius_x);
                intermediateTextures.push({
                    texture: tex_blur_tmp,
                    name: `Horizontal: ${tex_blur_tmp.width}×${tex_blur_tmp.height}`
                });
            }
            // Vertical pass: temp -> output (or input -> output if no horizontal)
            if (blur_params.radius_y > 0) {
                const vertInput = blur_params.radius_x > 0 ? tex_blur_tmp : tex_source;
                separablePass(commandEncoder, vertInput, tex_blurred, blur_params.mode, false, blur_params.radius_y);
                blurredOutput = tex_blurred;
            } else {
                blurredOutput = tex_blur_tmp;
            }
        }
    }

    // Update the texture list UI
    updateTextureList();

    // Get the texture to display based on selection
    const textureToDisplay = getDisplayTexture(blurredOutput);

    // Create bind group for final display
    const displayBindGroup = gpu_device.createBindGroup({
        layout: pip_display.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: gpu_sampler_linear },
            { binding: 1, resource: textureToDisplay.createView() },
        ],
    });

    // Final pass: render to screen with sRGB conversion
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: gpu_ctx.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(pip_display);
    renderPass.setBindGroup(0, displayBindGroup);
    renderPass.draw(3);
    renderPass.end();

    gpu_device.queue.submit([commandEncoder.finish()]);
    // Snapshot in the same task, before WebGPU presents/clears the canvas.
    if (captureFrame) return captureFrame();
}

// ================ Event handlers

function setupEventHandlers() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    // Texture list selection
    document.getElementById('textureList').addEventListener('change', (e) => {
        selectedTextureIndex = parseInt(e.target.value);
        render();
    });

    // Click to browse
    dropzone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageFile(e.target.files[0]);
        }
    });

    // Window resize
    window.addEventListener('resize', () => {
        if (cur_image_size.width > 0) {
            fitCanvasToViewport(cur_image_size.width, cur_image_size.height);
        }
    });

    // Drag and drop
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleImageFile(files[0]);
        }
    });

    // Sample file links
    document.querySelectorAll('.sample-link').forEach(link => {
        link.addEventListener('click', async (e) => {
            e.preventDefault();
            if (renderingVideo) return;
            const src = link.dataset.src;
            const statusEl = document.getElementById('status');
            const errorEl = document.getElementById('error');
            try {
                statusEl.textContent = `Loading ${src}...`;
                errorEl.textContent = '';
                const response = await fetch(src);
                if (!response.ok) throw new Error(`Failed to fetch ${src}`);
                const blob = await response.blob();
                const file = new File([blob], src.split('/').pop(), { type: blob.type });
                handleImageFile(file);
            } catch (err) {
                errorEl.textContent = `Error loading sample ${src}: ${err.message}`;
                statusEl.textContent = '';
            }
        });
    });

    // Blur mode radio buttons
    const disableReducedBlending = document.getElementById('disableReducedBlending');
    disableReducedBlending.disabled = blur_params.mode !== BlurMode.REDUCED_GAUSSIAN;
    disableReducedBlending.addEventListener('change', (e) => {
        blur_params.disable_reduced_blending = e.target.checked;
        resetTextureSelection();
        onBlurParamsChanged();
    });
    document.querySelectorAll('input[name="blurMode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            blur_params.mode = e.target.value;
            disableReducedBlending.disabled = blur_params.mode !== BlurMode.REDUCED_GAUSSIAN;
            // Reset texture selection to final output when blur mode changes
            resetTextureSelection();
            onBlurParamsChanged();
        });
    });

    // Radius X slider
    const radiusX = document.getElementById('radiusX');
    const radiusXValue = document.getElementById('radiusXValue');
    const radiusY = document.getElementById('radiusY');
    const radiusYValue = document.getElementById('radiusYValue');
    const radiusYRow = document.getElementById('radiusYRow');
    const lockRadius = document.getElementById('lockRadius');
    const animateRadius = document.getElementById('animateRadius');
    let animationFrame = null;
    let animationStart = null;

    function setAnimatedRadius(elapsed) {
        // Grow together for the first third, then shrink both over the remainder.
        // Y starts fast and slows down; X starts slow and catches up at the end.
        const phase = (elapsed / (BLUR_ANIMATION_DURATION / 3)) % 3;
        const shrink = Math.max(0, (phase - 1) / 2);
        const x = phase < 1 ? phase : 1 - shrink ** 2;
        const y = blur_params.lock_radius ? x : phase < 1 ? phase : (1 - shrink) ** 2;
        const min = Number(radiusX.min);
        const max = Number(radiusX.max);
        blur_params.radius_x = Math.round(min + x * (max - min));
        blur_params.radius_y = Math.round(min + y * (max - min));
        radiusX.value = blur_params.radius_x;
        radiusY.value = blur_params.radius_y;
        radiusXValue.textContent = blur_params.radius_x;
        radiusYValue.textContent = blur_params.radius_y;
    }

    function animateBlurRadius(timestamp) {
        if (!animateRadius.checked) return;
        if (animationStart === null) animationStart = timestamp;
        setAnimatedRadius(timestamp - animationStart);
        onBlurParamsChanged();
        animationFrame = requestAnimationFrame(animateBlurRadius);
    }

    animateRadius.addEventListener('change', () => {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        animationStart = null;
        if (animateRadius.checked) animationFrame = requestAnimationFrame(animateBlurRadius);
    });

    const renderVideo = document.getElementById('renderVideo');
    const videoStatus = document.getElementById('videoStatus');
    let videoURL = null;
    renderVideo.addEventListener('click', () => renderVideoCycle(false));
    document.getElementById('timeNoopVideo').addEventListener('click', () => renderVideoCycle(true));

    async function renderVideoCycle(skipBlur) {
        if (renderingVideo) return;
        if (!gpu_device || !tex_source || loadingImages) {
            videoStatus.textContent = 'Load an image before rendering a video.';
            return;
        }
        if (typeof VideoEncoder === 'undefined') {
            videoStatus.textContent = 'Video export requires a browser with WebCodecs video encoding (HTTPS or localhost).';
            return;
        }
        const started = performance.now();
        renderingVideo = true;
        const resumeAnimation = animateRadius.checked;
        animateRadius.checked = false;
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        animationStart = null;
        lockRadius.checked = false;
        blur_params.lock_radius = false;
        radiusY.disabled = false;
        radiusYRow.classList.remove('disabled');
        resetTextureSelection();
        const controls = [...document.querySelectorAll('input, select, button')];
        const disabledStates = controls.map(control => control.disabled);
        controls.forEach(control => { control.disabled = true; });
        const dropzone = document.getElementById('dropzone');
        dropzone.inert = true;
        videoStatus.textContent = 'Preparing video…';
        if (videoURL) { URL.revokeObjectURL(videoURL); videoURL = null; }
        try {
            const method = blur_params.mode;
            const blob = await exportBlurVideo({
                canvas: document.getElementById('canvas'),
                renderFrame: (elapsed, capture) => {
                    setAnimatedRadius(elapsed);
                    return render(capture, skipBlur);
                },
                onProgress: (done, total) => {
                    videoStatus.textContent = `Rendering video: ${done}/${total} frames…`;
                },
            });
            videoURL = URL.createObjectURL(blob);
            const download = document.createElement('a');
            download.href = videoURL;
            download.download = `blur-anim-${skipBlur ? 'noop' : method}.mp4`;
            download.textContent = 'Download again';
            videoStatus.replaceChildren(download);
            download.click();
            const elapsed = ((performance.now() - started) / 1000).toFixed(2);
            videoStatus.prepend(`${skipBlur ? 'No-op video' : 'Video'} rendered and encoded in ${elapsed}s (${BLUR_ANIMATION_DURATION / 1000}s video, 60 fps). `);
        } catch (error) {
            videoStatus.textContent = `Video export failed: ${error.message}`;
        } finally {
            renderingVideo = false;
            controls.forEach((control, i) => { control.disabled = disabledStates[i]; });
            dropzone.inert = false;
            setAnimatedRadius(0);
            render();
            animateRadius.checked = resumeAnimation;
            if (resumeAnimation) animationFrame = requestAnimationFrame(animateBlurRadius);
        }
    }

    radiusX.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        blur_params.radius_x = value;
        radiusXValue.textContent = value;

        if (blur_params.lock_radius) {
            blur_params.radius_y = value;
            radiusY.value = value;
            radiusYValue.textContent = value;
        }
        onBlurParamsChanged();
    });

    // Radius Y slider
    radiusY.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        blur_params.radius_y = value;
        radiusYValue.textContent = value;
        onBlurParamsChanged();
    });

    // Lock checkbox
    lockRadius.addEventListener('change', (e) => {
        blur_params.lock_radius = e.target.checked;
        radiusY.disabled = e.target.checked;
        radiusYRow.classList.toggle('disabled', e.target.checked);

        if (e.target.checked) {
            // Sync Y to X when locking
            blur_params.radius_y = blur_params.radius_x;
            radiusY.value = blur_params.radius_x;
            radiusYValue.textContent = blur_params.radius_x;
            onBlurParamsChanged();
        }
    });
}

function onBlurParamsChanged() {
    render();
}

async function main() {
    setupEventHandlers();
    await initWebGPU();
}
main();
</script>
</body>
</html>
